# ─────────────────────────────────────────────────────────────────────────
# QuantumAtlas — qatlasd only (BYO rustfs + PostgreSQL)
#
# Use this when you already have external object storage (RustFS on a
# NAS, AWS S3, R2, etc.) and an external PostgreSQL (the paper registry
# + OpenAlex corpus database). All the interesting connection details
# come from the YAML config file on the host, so qatlasd itself can stay
# stateless and trivially redeploy.
#
# qatlasd rejects ALL environment-variable configuration (QATLAS_* etc.)
# at startup — there is deliberately no `environment:` block here. Edit
# the config file instead:
#
#   qatlasd config init                      # creates ~/.qatlas/config.yaml
#   $EDITOR ~/.qatlas/config.yaml            # fill ALL of s3.*, postgres.dsn,
#                                            # auth.* — there's no fallback
#
# For the all-in-one flavour see ./docker-compose.yml.
# Full discussion: docs/server/docker.md.
#
# Usage:
#   $EDITOR ~/.qatlas/config.yaml
#   mkdir -p data/pb_data
#   chown -R 65532:65532 data/      # distroless nonroot UID
#   docker compose -f docker-compose.standalone.yml up -d
#   curl http://localhost:4200/api/health
# ─────────────────────────────────────────────────────────────────────────

services:
  qatlasd:
    image: ghcr.io/iai-ustc-quantum/qatlasd:${QATLAS_VERSION:-latest}
    # build:
    #   context: ..
    #   args:
    #     VERSION: ${QATLAS_VERSION:-local}
    container_name: qatlasd
    restart: unless-stopped
    # PocketBase's own --dir defaults to /pb_data (unwritable under the
    # nonroot user); point it at the mounted volume instead.
    command: ["serve", "--http=0.0.0.0:4200", "--dir=/data/pb_data"]
    volumes:
      # The YAML config file is the single source of truth. Mounted
      # read-only at the distroless nonroot user's (UID 65532) home —
      # that is where qatlasd looks by default (~/.qatlas/config.yaml).
      - ${HOME}/.qatlas/config.yaml:/home/nonroot/.qatlas/config.yaml:ro
      # Docs override directory — same contract as docker-compose.yml:
      # when populated (deploy/update-docs.sh), qatlasd serves /doc and
      # /devdoc from here instead of the embedded copies, so docs
      # updates need no restart. Read-only.
      - ${HOME}/.qatlas/docs:/home/nonroot/.qatlas/docs:ro
      - ./data/pb_data:/data/pb_data
      # raw_dir is unused when S3 is configured but the directory still
      # has to exist so the volume mount succeeds.
      - ./data/raw:/data/raw
    ports:
      - "127.0.0.1:4200:4200"
