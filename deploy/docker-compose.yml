# ─────────────────────────────────────────────────────────────────────────
# QuantumAtlas docker-compose
#
# One service: qatlasd — the Go server. Listens on 127.0.0.1:4200; put a
# TLS reverse proxy in front of it for the public hostname (see
# docs/server/reverse-proxy.md or add a Caddy service block below).
#
# Configuration comes from a YAML file on the HOST, bind-mounted into the
# container read-only (see volumes below). qatlasd rejects ALL
# environment-variable configuration (QATLAS_* etc.) at startup — don't
# add an `environment:` block here; edit the config file instead:
#
#   qatlasd config init                      # creates ~/.qatlas/config.yaml
#   $EDITOR ~/.qatlas/config.yaml
#
# PostgreSQL is deliberately NOT part of this file: the paper registry +
# OpenAlex corpus live in ONE database (default `qatlas`) on a shared /
# general-purpose PostgreSQL instance. Point qatlasd at it with
# postgres.dsn in config.yaml — goose migrations auto-apply at boot. To
# reach a postgres listening on the HOST's 127.0.0.1:5432 from inside the
# container, use host.docker.internal (the extra_hosts mapping below
# enables it):
#
#   postgres:
#     dsn: postgres://qatlas:<pw>@host.docker.internal:5432/qatlas?sslmode=disable
#
# Object storage (RustFS / S3) is likewise external: production RustFS
# typically lives on a NAS, reached over the network via the s3 section.
# Leave s3 empty for the local RawDir dev fallback.
#
# In-container paths: the container command pins --dir=/data/pb_data, so
# set `paths.raw_dir: /data/raw` in config.yaml when using the local
# store (S3 deployments don't read raw_dir).
#
# Usage:
#   qatlasd config init               # on the host, then edit
#   $EDITOR ~/.qatlas/config.yaml     # fill postgres.dsn + s3 + GitHub OAuth
#   mkdir -p ../data/{raw,pb_data}  # repo-root data/ (bind-mounted)
#   chown -R 65532:65532 ../data/{raw,pb_data}    # distroless nonroot UID
#   docker compose up -d
#   docker compose logs -f qatlasd  # watch startup (migrations apply here)
#   curl http://localhost:4200/api/health
# ─────────────────────────────────────────────────────────────────────────

services:
  qatlasd:
    # Pulled from GitHub Container Registry by default. Replace with a
    # local build by uncommenting the `build:` line and removing the
    # `image:` directive.
    image: ghcr.io/iai-ustc-quantum/qatlasd:${QATLAS_VERSION:-latest}
    # build:
    #   context: ..
    #   args:
    #     VERSION: ${QATLAS_VERSION:-local}
    container_name: qatlasd
    restart: unless-stopped
    # PocketBase's own --dir defaults to /pb_data (unwritable under the
    # nonroot user); point it at the mounted volume instead.
    command: ["serve", "--http=0.0.0.0:4200", "--dir=/data/pb_data"]
    extra_hosts:
      # Lets postgres.dsn (and S3 endpoints, if any) refer to services
      # listening on the docker host's non-loopback addresses.
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - shared-infra
    volumes:
      # The YAML config file is the single source of truth. Mounted
      # read-only at the distroless nonroot user's (UID 65532) home —
      # that is where qatlasd looks by default (~/.qatlas/config.yaml).
      - ${HOME}/.qatlas/config.yaml:/home/nonroot/.qatlas/config.yaml:ro
      # Docs override directory: when populated (deploy/update-docs.sh
      # refreshes it from the CI-built qatlas-docs image), qatlasd serves
      # /doc and /devdoc from here instead of the copies embedded in the
      # binary — docs updates need NO qatlasd restart. Read-only; when
      # the host directory does not exist, docker creates an empty one
      # and qatlasd simply falls back to the embedded docs.
      - ${HOME}/.qatlas/docs:/home/nonroot/.qatlas/docs:ro
      # Bind mounts to the repo-root ./data/* (relative to this file:
      # ../data) so backups are `tar czf data.tgz data/` and there's no
      # `docker volume export` ceremony. Replace with named volumes (see
      # bottom of file) if you prefer.
      - ../data/raw:/data/raw
      - ../data/pb_data:/data/pb_data
    ports:
      # Loopback only by default — put a reverse proxy in front for
      # public access (see Caddy / nginx snippets in
      # docs/server/reverse-proxy.md). To expose directly, change
      # to "4200:4200" — only safe on a private network.
      - "127.0.0.1:4200:4200"

  # ── qatlas-search: agentic multi-source search microservice ─────────────
  # Optional. Lives in the separate repository IAI-USTC-Quantum/qatlas-search;
  # its release workflow publishes the image to ghcr (deploy hosts pull,
  # never build). Pin the version via QATLAS_SEARCH_VERSION in .env.
  # Bring it online with:  docker compose --profile search up -d
  #
  # Deliberately NO ports mapping: the only legitimate caller is qatlasd
  # (which meters and quotas every agentic search), so the service is
  # reachable only inside the shared-infra network. Point qatlasd at it
  # via ~/.qatlas/config.yaml:
  #   search:
  #     remote: { enabled: true, url: "http://qatlas-search:8600", token: "..." }
  # The token must match `search.service_token` in the microservice's own
  # config file (~/.qatlas/search.yaml, mounted below).
  qatlas-search:
    image: ghcr.io/iai-ustc-quantum/qatlas-search:${QATLAS_SEARCH_VERSION:-latest}
    container_name: qatlas-search
    restart: unless-stopped
    profiles: ["search"]
    networks:
      - shared-infra
    volumes:
      # The microservice has its OWN config file (qatlasd strictly rejects
      # unknown keys, so the two cannot share config.yaml). Only the
      # `search:` section of this file is consumed (backend keys, agent LLM
      # settings, service_token — which must match qatlasd's
      # search.remote.token).
      # Mounted read-write (no :ro) so the admin config endpoint
      # (PUT /v1/admin/config, proxied through qatlasd's admin page) can
      # persist updates back to this file.
      - ${HOME}/.qatlas/search.yaml:/etc/qatlas-search/config.yaml

  # ── qatlas-match: paper identity matching microservice ─────────────────
  # Optional. Lives in the separate repository IAI-USTC-Quantum/qatlas-match;
  # its release workflow publishes the image to ghcr (deploy hosts pull,
  # never build). Pin the version via QATLAS_MATCH_VERSION in .env.
  # Bring it online with:  docker compose --profile match up -d
  #
  # High-precision registry matching ("is this work already in qatlas,
  # what is its unified qa_… id?") for DOIs / arXiv ids / OpenAlex ids /
  # paper URLs / titles. The microservice reads the SAME PostgreSQL
  # registry qatlasd uses (read-only connection), so it must be able to
  # reach the postgres container — shared-infra membership covers that.
  #
  # Deliberately NO ports mapping: the only legitimate caller is qatlasd
  # (which owns user auth on POST /api/papers/match). Point qatlasd at it
  # via ~/.qatlas/config.yaml:
  #   match:
  #     remote: { enabled: true, url: "http://qatlas-match:8601", token: "..." }
  # The token must match `match.service_token` in the microservice's own
  # config file (~/.qatlas/match.yaml, mounted below).
  qatlas-match:
    image: ghcr.io/iai-ustc-quantum/qatlas-match:${QATLAS_MATCH_VERSION:-latest}
    container_name: qatlas-match
    restart: unless-stopped
    profiles: ["match"]
    networks:
      - shared-infra
    volumes:
      # Own config file (same reasoning as qatlas-search above). Read-only:
      # the match service exposes no admin config endpoint. Only the
      # `match:` section is consumed (service_token, service_port,
      # postgres.dsn).
      - ${HOME}/.qatlas/match.yaml:/etc/qatlas-match/config.yaml:ro

  # ── qatlas-rag: GPU semantic-retrieval microservice ───────────────────
  # Optional. Lives in the separate repository IAI-USTC-Quantum/qatlas-rag;
  # its release workflow publishes the image to ghcr (deploy hosts pull,
  # never build). Pin the version via QATLAS_RAG_VERSION in .env.
  # Bring it online with:  docker compose --profile rag up -d
  #
  # GPU note: the service needs an NVIDIA GPU (bge-m3 + reranker). If THIS
  # host has none, run qatlas-rag on the GPU host instead (compose example
  # in the qatlas-rag repo, deploy/docker-compose.example.yaml) and point
  # qatlasd's rag.remote.url at it over the mesh / shared-infra network.
  #
  # Deliberately NO ports mapping: the only legitimate callers are qatlasd
  # (index push on paper-ready, plus /healthz probing) and qatlas-search
  # (retrieval backend). Point qatlasd at it via ~/.qatlas/config.yaml:
  #   rag:
  #     remote: { enabled: true, url: "http://qatlas-rag:8801", token: "..." }
  # and qatlas-search via its own ~/.qatlas/search.yaml:
  #   search:
  #     rag: { enabled: true, url: "http://qatlas-rag:8801", token: "..." }
  # Both tokens must match `rag.service_token` in the microservice's own
  # config file (~/.qatlas/rag.yaml, mounted below).
  qatlas-rag:
    image: ghcr.io/iai-ustc-quantum/qatlas-rag:${QATLAS_RAG_VERSION:-latest}
    container_name: qatlas-rag
    restart: unless-stopped
    profiles: ["rag"]
    networks:
      - shared-infra
    volumes:
      # Own config file (same reasoning as qatlas-search above). Mounted
      # read-write so PUT /v1/admin/config can persist updates.
      - ${HOME}/.qatlas/rag.yaml:/etc/qatlas-rag/config.yaml
      # Hugging Face model cache: avoids re-downloading the bge-m3 /
      # reranker weights on container rebuilds.
      - hf-cache:/home/qatlas/.cache/huggingface
    # Requires nvidia-container-toolkit on the host; drop this block only
    # if you know the models should run on CPU (not supported).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# Shared network for reaching sibling infrastructure containers (e.g. the
# standalone general-purpose `postgres` container) by name. Create once:
#   docker network create shared-infra
#   docker network connect shared-infra postgres
networks:
  shared-infra:
    external: true

volumes:
  # Model-weight cache for the qatlas-rag service (see above).
  hf-cache:

# ── Alternative storage: docker named volumes ─────────────────────────────
# Uncomment this block + delete the `./data/*` host paths above if you
# prefer docker-managed volumes over bind mounts. Note the docker data
# root on this host already lives on the large /data disk, so named
# volumes land there too.
#
# volumes:
#   qatlas_raw: {}
#   qatlas_pb_data: {}
