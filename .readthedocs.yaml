# Read the Docs publishes the MkDocs site with its own documentation-only
# requirements; the repository is a Go module, not a Python distribution.
# PR/branch validation also runs in go.yml; independent Sphinx content images
# are built by docs.yml. RTD publication does not publish a Python package.

version: 2

build:
  os: "ubuntu-24.04"
  tools:
    # 钉 3.12 而不是 "3"（"3" 会被解析成最新版，目前是 3.14，
    # mkdocs 生态部分 plugin 在 3.14 上 wheel 还没补齐）
    python: "3.12"
  jobs:
    post_checkout:
      # 把 shallow clone 拉成 full clone，git-revision-date-localized-plugin
      # 才能拿到每个文件的真实最后修改时间；失败不影响 build
      - git fetch --unshallow || true

python:
  install:
    - requirements: docs/requirements.txt

mkdocs:
  configuration: mkdocs.yml
