  /api/papers/{arxiv_id}/upload-mineru:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Accepts the entire MinerU result zip exactly as returned by `full_zip_url`. Server extracts `full.md` plus every `images/*` entry and stores them to the markdown and images object buckets respectively. Images are written before the markdown so any reader that observes the markdown also observes all referenced images. Replaces the v0.7.x `upload-markdown` endpoint (which only accepted a single .md file and silently dropped images).

        The {arxiv_id} slot also accepts a DOI (`10.<registrant>/<suffix>`) to contribute the converted *published* version. DOI bundles are stored under the `markdown/doi/...` + `images/doi/...` namespace; the server resolves canonical metadata (title, authors, linked arxiv id) from OpenAlex on the contributor's behalf — there is no `title` / `authors` form field. `verify=strict` rejects when OpenAlex cannot resolve the DOI (see upload-pdf). The result is reported in `X-QAtlas-Verification`.
      parameters:
      - description: arXiv identifier (with vN) OR DOI (10.x/...)
        in: path
        name: arxiv_id
        required: true
        type: string
      - description: overwrite on content conflict
        in: query
        name: overwrite
        type: boolean
      - description: client-computed zip sha256 (in-transit integrity check)
        in: query
        name: expected_sha256
        type: string
      - description: sha256 of the source PDF that was converted (cross-checked against
          stored PDF)
        in: query
        name: pdf_sha256
        type: string
      - description: 'DOI only: ''strict'' rejects when OpenAlex cannot resolve the
          DOI (default warn)'
        in: query
        name: verify
        type: string
      - description: short label of the contributor's MinerU run (truncated to 64
          chars)
        in: query
        name: source
        type: string
      - description: MinerU result zip (must contain full.md; optional images/*)
        in: formData
        name: mineru_zip
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload paper MinerU bundle (arXiv id or DOI)
      tags:
      - Papers
  /api/papers/{arxiv_id}/upload-pdf:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Content-addressed upload with sha256 idempotency. 200 when
        bytes are unchanged, 201 when written, 409 on a content
        conflict without overwrite=true.

        The {arxiv_id} slot also accepts a DOI (`10.<registrant>/<suffix>`)
        for contributing a *published* version that may have no arXiv
        preprint. DOI uploads are stored under a disjoint `pdf/doi/...`
        namespace and the server resolves the DOI's title / authors /
        linked arxiv id from OpenAlex — the contributor cannot supply
        that metadata. The result is reported in `X-QAtlas-Verification`
        and the JSON `verification` block; `verify=strict` rejects a
        doi-not-found with 409 (or metadata-unavailable / unconfigured
        with 503).
      parameters:
      - description: arXiv identifier (with vN) OR DOI (10.x/...)
        in: path
        name: arxiv_id
        required: true
        type: string
      - description: overwrite on content conflict
        in: query
        name: overwrite
        type: boolean
      - description: client-computed PDF sha256 (in-transit guard)
        in: query
        name: expected_sha256
        type: string
      - description: 'DOI only: ''strict'' rejects when OpenAlex cannot resolve the
          DOI (default warn)'
        in: query
        name: verify
        type: string
      - description: PDF file
        in: formData
        name: pdf
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: unchanged
          schema:
            additionalProperties: true
            type: object
        "201":
          description: created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload paper PDF (arXiv id or DOI)
      tags:
      - Papers
  /api/papers/{id_or_doi}/images/zip:
    get:
      description: |-
        Returns the images zip (application/zip) for the given
        arxiv id or DOI — the bundle the MinerU conversion
        produced alongside the markdown. Only registered when
        QATLAS_PAPER_ACCESS_ENABLED=true on the server.

        Canonical resolution: same DOI-wins rule as
        /api/papers/{id_or_doi}/markdown; pass `?force_arxiv=1`
        to opt out per request.

        This endpoint has no long-running-operation semantics:
        when no images zip is stored it answers 404 (fetch
        /markdown first to trigger the conversion that produces
        the images).

        Transport (ADR 0011): defaults to a byte stream
        (application/zip). Pass `?format=link` to instead
        receive a JSON body with a short-lived RustFS direct
        link (`{images_url, format:"link", expires_in}`); on a
        backend that cannot presign (dev LocalStore) a link
        request transparently falls back to bytes. Any other
        ?format= value is a 400.
      parameters:
      - description: arXiv canonical id with vN suffix, or a DOI
        in: path
        name: id_or_doi
        required: true
        type: string
      - description: '1/true: bypass DOI-canonical default; return 409 if DOI has
          no arxiv twin'
        in: query
        name: force_arxiv
        type: string
      - description: link|bytes — override the default transport (images zip defaults
          to bytes)
        in: query
        name: format
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: images zip bytes (application/zip), or a JSON {images_url}
            when ?format=link
          schema:
            type: string
        "400":
          description: invalid arxiv_id or DOI, or invalid ?format= value
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no images available (fetch /markdown first to trigger conversion)
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: force_arxiv requested but DOI has no arxiv twin
          schema:
            additionalProperties: true
            type: object
        "503":
          description: DOI resolution unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get paper images zip
      tags:
      - Papers
  /api/papers/{id_or_doi}/markdown:
    get:
      description: |-
        Returns the cached MinerU markdown for the given arxiv id
        (or DOI — the id_or_doi path component is auto-detected
        against the IANA prefix `10.<registrant>/...`). Only
        registered when QATLAS_PAPER_ACCESS_ENABLED=true on the
        server (default off).

        Canonical resolution: a `:PaperWork` node with
        `identifier_scheme='doi'` ALWAYS wins over its arxiv
        twin when both exist — DOI is the canonical identity of
        the published version. The dispatcher serves DOI bytes
        for either id form when a DOI contribution is on file;
        pass `?force_arxiv=1` to opt out per request (DOI input
        with force_arxiv + no arxiv twin returns 409). See
        docs/server/upload-api.md §Canonical resolution.

        Long-running operation semantics: on cache miss the
        server may transparently fetch the PDF from arxiv.org
        (silent_fetch) — or, for a DOI without an arXiv twin,
        from the open-access PDF URL OpenAlex surfaces
        (best_oa_location.pdf_url) — and trigger a MinerU
        conversion. The first call returns 202 with
        `Operation-Location:
        /api/papers/{id}/markdown/status` and `Retry-After: 5`;
        clients poll the status endpoint until state=cached then
        re-GET this resource for the bytes. A DOI with no arXiv
        twin and no OA PDF stays 404 (contribute the PDF via
        POST /api/papers/{doi}/upload-pdf).

        Transport (ADR 0011): markdown DEFAULTS to a byte stream
        (text/markdown). Pass `?format=link` to instead receive a
        JSON body with a short-lived RustFS direct link
        (`{markdown_url, format:"link", expires_in}`); on a backend
        that cannot presign (dev LocalStore) a link request
        transparently falls back to bytes.
      parameters:
      - description: arXiv canonical id with vN suffix, or a DOI (e.g. 10.1103/PhysRevLett.103.150502)
        in: path
        name: id_or_doi
        required: true
        type: string
      - description: '1/true: bypass the DOI-canonical default and serve the arxiv
          twin (or 409 if no twin exists)'
        in: query
        name: force_arxiv
        type: string
      - description: link|bytes — override the default transport (markdown defaults
          to bytes)
        in: query
        name: format
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: markdown bytes (text/markdown), or a JSON {markdown_url} when
            ?format=link
          schema:
            type: string
        "202":
          description: long-running operation started; poll status_url
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid arxiv_id or DOI
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: DOI unknown to OpenAlex / no arXiv twin and no OA PDF (contrib
            upload possible); or paper unknown and silent fetch unavailable
          schema:
            additionalProperties: true
            type: object
        "409":
          description: force_arxiv requested but DOI has no arxiv twin
          schema:
            additionalProperties: true
            type: object
        "502":
          description: prior conversion failed inside the cooldown window, or OpenAlex
            upstream error
          schema:
            additionalProperties: true
            type: object
        "503":
          description: cache-only mode (no MinerU keys), or DOI resolution unavailable
            (QATLAS_OPENALEX_MAILTO unset)
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get paper markdown
      tags:
      - Papers
  /api/papers/{id_or_doi}/markdown/status:
    get:
      description: |-
        Side-effect-free poll surface. Never starts a job and
        never triggers a fetch. Only registered when
        QATLAS_PAPER_ACCESS_ENABLED=true on the server.

        Canonical resolution: same DOI-wins rule as
        /api/papers/{id_or_doi}/markdown. Pass `?force_arxiv=1`
        to query the arxiv-side status instead.

        Response shape always carries the agent-decision triple
        `state / pdf_ready / md_ready` plus an optional `phase`
        (fetching_pdf | converting_md | ready | error_fetching |
        error_converting) and `fetch` / `convert` sub-objects
        with bytes_received / mineru_task_id / polled_count so a
        polling client can show precise progress.
      parameters:
      - description: arXiv canonical id or DOI
        in: path
        name: id_or_doi
        required: true
        type: string
      - description: '1/true: bypass DOI-canonical default'
        in: query
        name: force_arxiv
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status payload (state ∈ cached|queued|running|none|failed|cooldown|unavailable)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: paper unknown and silent fetch unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get markdown conversion status
      tags:
      - Papers
  /api/papers/{id_or_doi}/pdf:
    get:
      description: |-
        PDF delivery is disabled. This endpoint no longer
        serves PDF bytes (or direct links) in any state: it
        validates the id and always returns 410 Gone with
        `{"detail": "PDF delivery is disabled; use the markdown
        endpoint instead"}`. Use
        /api/papers/{id_or_doi}/markdown instead. Only
        registered when QATLAS_PAPER_ACCESS_ENABLED=true on the
        server.
      parameters:
      - description: arXiv canonical id with vN suffix, or a DOI
        in: path
        name: id_or_doi
        required: true
        type: string
      - description: '1/true: bypass DOI-canonical default; return 409 if DOI has
          no arxiv twin'
        in: query
        name: force_arxiv
        type: string
      produces:
      - application/json
      responses:
        "400":
          description: invalid arxiv_id or DOI
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: force_arxiv requested but DOI has no arxiv twin
          schema:
            additionalProperties: true
            type: object
        "410":
          description: PDF delivery is disabled; use the markdown endpoint instead
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: OpenAlex upstream error (DOI dispatch)
          schema:
            additionalProperties: true
            type: object
        "503":
          description: DOI resolution unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get paper PDF (disabled — 410 Gone)
      tags:
      - Papers
  /api/papers/{id_or_doi}/pdf/status:
    get:
      description: |-
        Side-effect-free probe reporting the pdf_ready /
        md_ready booleans for a paper. Retained for debugging
        after PDF delivery was disabled (GET .../pdf answers
        410 Gone); the body no longer carries a pdf_url. Only
        registered when QATLAS_PAPER_ACCESS_ENABLED=true.

        Canonical resolution: same DOI-wins rule as
        /api/papers/{id_or_doi}/markdown. Pass `?force_arxiv=1`
        to query the arxiv-side status instead.
      parameters:
      - description: arXiv canonical id or DOI
        in: path
        name: id_or_doi
        required: true
        type: string
      - description: '1/true: bypass DOI-canonical default'
        in: query
        name: force_arxiv
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status payload (state ∈ cached|queued|running|none|failed|unavailable)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get PDF fetch status
      tags:
      - Papers
  /api/papers/{paper_id}:
    get:
      description: |-
        Returns the registry paper (status, identities) plus its
