            additionalProperties:
              type: string
            type: object
        "403":
          description: PAT auth not accepted
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List my search API keys
      tags:
      - Me
  /api/me/search-keys/{backend}:
    delete:
      description: |-
