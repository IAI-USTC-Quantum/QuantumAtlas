      - description: pending|confirmed|retracted|none
        in: query
        name: status
        type: string
      - description: parse revision id
        in: query
        name: parse_revision
        type: string
      - description: 0-based page index
        in: query
        name: page_idx
        type: integer
      - description: 1-based public block index
        in: query
        name: block_index
        type: integer
      - description: keyset cursor (last discussion_id)
        in: query
        name: cursor
        type: string
