basePath: /
definitions:
  routes.externalSourceRequest:
    properties:
      authors:
        items:
          type: string
        type: array
      source_url:
        type: string
      title:
        type: string
      year:
        maximum: 9999
        minimum: 1
        type: integer
    required:
    - authors
    - source_url
    - title
    - year
    type: object
  routes.meUsageResponse:
    properties:
      limit:
        type: integer
      llm_tokens:
        type: integer
      metric:
        type: string
      today:
        type: integer
    type: object
  routes.oauthDeviceCodeRequest:
    properties:
      description:
        type: string
      expires_in_days:
        type: integer
      name:
        type: string
      scopes:
        items:
          type: string
        type: array
    type: object
  routes.oauthDeviceCodeResponse:
    properties:
      device_code:
        type: string
      expires_in:
        type: integer
      interval:
        type: integer
      user_code:
        type: string
      verification_uri:
        type: string
      verification_uri_complete:
        type: string
    type: object
  routes.oauthDeviceLookupResponse:
    properties:
      available_scopes:
        items:
          type: string
        type: array
      description:
        type: string
      expires_in_days:
        type: integer
      max_expiry_days:
        type: integer
      name:
        type: string
      scope_descriptions:
        additionalProperties:
          type: string
        type: object
      scopes:
        items:
          type: string
        type: array
      status:
        type: string
      user_code:
        type: string
    type: object
  routes.oauthDeviceTokenError:
    properties:
      error:
        type: string
    type: object
  routes.oauthDeviceTokenRequest:
    properties:
      device_code:
        type: string
    type: object
  routes.oauthDeviceTokenResponse:
    properties:
      expires_at:
        type: string
      name:
        type: string
      pat_id:
        type: string
      plaintext:
        type: string
      prefix:
        type: string
      scopes:
        items:
          type: string
        type: array
    type: object
  routes.oauthDeviceUserCodeBody:
    properties:
      user_code:
        type: string
    type: object
  routes.patCreateRequest:
    properties:
      description:
        type: string
      expires_in_days:
        description: 'REQUIRED: 1..MaxPATExpiryDays'
        type: integer
      name:
        type: string
      scopes:
        description: 'REQUIRED: may be empty for "no permissions"'
        items:
          type: string
        type: array
    type: object
  routes.patCreateResponse:
    properties:
      created:
        type: string
      description:
        type: string
      expires_at:
        type: string
      id:
        type: string
      name:
        type: string
      plaintext:
        type: string
      prefix:
        type: string
      scopes:
        items:
          type: string
        type: array
    type: object
  routes.patSummary:
    properties:
      created:
        type: string
      description:
        type: string
      expires_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        type: string
      prefix:
        type: string
      scopes:
        items:
          type: string
        type: array
    type: object
info:
  contact:
    name: QuantumAtlas
    url: https://quantum-atlas.ai
  description: |-
    Go + PocketBase backend for QuantumAtlas: paper
    collection + search + database. Write endpoints and
    the search/paper read surface require a bearer token
    (PAT or PocketBase session) plus the matching scope.
    See the auth model docs for the scope vocabulary.
  title: QuantumAtlas API
  version: "1.0"
paths:
  /api/admin/assets/{paper_id}:
    get:
      description: |-
        Admin-only asset listing: every PDF / markdown object the
        paper owns, with S3 object keys, sizes, SHA256s.
      parameters:
      - description: paper id (qa_...)
        in: path
        name: paper_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List paper assets
      tags:
      - Admin
  /api/admin/assets/{paper_id}/{kind}/download:
    get:
      description: 'Admin-only proxy stream with Content-Disposition: attachment.'
      parameters:
      - description: paper id
        in: path
        name: paper_id
        required: true
        type: string
      - description: pdf | markdown
        in: path
        name: kind
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: Download paper asset
      tags:
      - Admin
  /api/admin/assets/{paper_id}/{kind}/url:
    get:
      description: 'Admin-only: time-limited presigned URL for direct browser-to-S3.'
      parameters:
      - description: paper id
        in: path
        name: paper_id
        required: true
        type: string
      - description: pdf | markdown
        in: path
        name: kind
        required: true
        type: string
      - description: duration (default 1h, max 24h)
        in: query
        name: ttl
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Presigned asset URL
      tags:
      - Admin
  /api/admin/assets/search:
    get:
      description: 'Admin-only: find papers with at least one asset.'
      parameters:
      - description: search query
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Search papers with assets
      tags:
      - Admin
  /api/admin/db/schema:
    get:
      description: |-
        Read-only introspection of the QATLAS_POSTGRES_DSN database:
        every table in schema public (goose_db_version included,
        alphabetical) with row estimate, total size, columns
        (type/nullable/default/is_pk), indexes and constraints.
        Admin-only: session token + is_admin or is_superadmin
        on the users record.
      produces:
      - application/json
      responses:
        "200":
          description: '{database, tables:[{name, row_estimate, total_size, columns,
            indexes, constraints}]}'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: admin only
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: postgres registry unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Postgres schema browser
      tags:
      - Admin
  /api/admin/devdoc/ticket:
    post:
      description: |-
        Returns {url} — a short-lived signed link into the admin-only
        dev-docs site (/devdoc). Opening it sets an HttpOnly cookie and
        redirects to the ticket-free URL; the cookie authorizes the
        docs for 12h. Admin-only: session token + is_admin or
        is_superadmin on the users record.
      produces:
      - application/json
      responses:
        "200":
          description: '{url}'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: admin only
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: dev docs not bundled
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Dev-docs ticket
      tags:
      - Admin
  /api/admin/users:
    get:
      description: |-
        Every users record: {users:[{id, name, email, github_login,
        gitea_login, is_admin, is_superadmin, disabled, created,
        updated}], total}.
        Requires a session AND one of: is_admin, is_superadmin
        (userAdminGuard — PATs rejected; the YAML admin lists are
        only a boot-time seed for those flags).
      produces:
      - application/json
      responses:
        "200":
          description: '{users, total}'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: user management requires admin / PAT auth not accepted
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - Admin
  /api/admin/users/{id}:
    patch:
      consumes:
      - application/json
      description: |-
        Body is a JSON object with any of {"disabled": bool,
        "is_admin": bool} — at least one key required. disabled needs
        admin-or-above; is_admin needs the is_superadmin flag.
        Self-protection: nobody may disable
        themselves or change their own is_admin; admins cannot
        disable superadmins. is_superadmin is not patchable here.
      parameters:
      - description: users record id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: the updated user record
          schema:
            additionalProperties: true
            type: object
        "400":
          description: empty or invalid body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: role too low / self-protection
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: user not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user flags
      tags:
      - Admin
  /api/admin/whoami:
    get:
      description: |-
        Returns {login, is_admin, is_user_admin, is_superadmin}
        for the signed-in session user. login is the github_login,
        falling back to gitea_login when only that is stamped.
        All three flags read the users-record role flags (the
        auth.admin_logins / superadmin_logins YAML lists only
        seed them at boot): is_admin and is_user_admin are true
        when the record holds is_admin or is_superadmin; the
        SPA uses them to decide which admin surfaces to render.
        Non-admins get false flags rather than a 403.
        Session-token auth only (PAT auth
        refused, same as /api/pat).
      produces:
      - application/json
      responses:
        "200":
          description: '{login, is_admin, is_user_admin, is_superadmin}'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: PAT auth not accepted
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Admin whoami
      tags:
      - Admin
  /api/discussions/{discussion_id}:
    get:
      description: |-
        The discussion plus the first (or cursor-continued) page
        of replies, oldest first, keyset-paginated by reply_id.
        The ETag response header carries the body revision integer
        used for If-Match CAS edits.
      parameters:
      - description: cd_ discussion id
        in: path
        name: discussion_id
        required: true
        type: string
      - description: keyset cursor (last reply_id)
        in: query
        name: cursor
        type: string
      - description: replies page size (default 20, max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Discussion detail
      tags:
      - Comments
  /api/discussions/{discussion_id}/body:
    patch:
      consumes:
      - application/json
      description: |-
        Author-only edit (the caller must be the body's author —
        admins do not edit other people's words). Requires
        If-Match with the current revision integer; a stale value
        is a 409, the new body increments the revision and the
        old/new pair is appended to the revision history. Editing
        never reopens the status.
      parameters:
      - description: cd_ discussion id
        in: path
        name: discussion_id
        required: true
        type: string
      - description: current revision integer (the ETag)
        in: header
        name: If-Match
        required: true
        type: string
      - description: '{body}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: missing/invalid If-Match
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: not the author
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: revision conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Edit discussion body
      tags:
      - Comments
  /api/discussions/{discussion_id}/replies:
    post:
      consumes:
      - application/json
      description: |-
        Flat reply inside the discussion. Same identity/idempotency/
        body-budget contract as discussion creation.
      parameters:
      - description: cd_ discussion id
        in: path
        name: discussion_id
        required: true
        type: string
      - description: replay key
        in: header
        name: Idempotency-Key
        type: string
      - description: '{body, model?}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reply to a discussion
      tags:
      - Comments
  /api/discussions/{discussion_id}/replies/{reply_id}/body:
    patch:
      consumes:
      - application/json
      description: |-
        Same author-only CAS contract as the discussion body edit,
        applied to one reply of the discussion.
      parameters:
      - description: cd_ discussion id
        in: path
        name: discussion_id
        required: true
        type: string
      - description: cr_ reply id
        in: path
        name: reply_id
        required: true
        type: string
      - description: current revision integer
        in: header
        name: If-Match
        required: true
        type: string
      - description: '{body}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: not the author
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: revision conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Edit reply body
      tags:
      - Comments
  /api/discussions/{discussion_id}/revisions:
    get:
      description: |-
        Append-only trail of one discussion: body_revisions (the
        discussion's and its replies' edits: target / target_id /
        old_body / new_body / editor / created_at) and
        status_events (from / to / reason / actor / created_at),
        both oldest-first.
      parameters:
      - description: cd_ discussion id
        in: path
        name: discussion_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Discussion history
      tags:
      - Comments
  /api/discussions/{discussion_id}/status:
    patch:
      consumes:
      - application/json
      description: |-
        Sets the status machine (pending / confirmed / retracted;
        reopen allowed). `reason` is mandatory and every change is
        appended to the status-event trail with the acting account.
        Allowed for the discussion's root author or a platform
        admin (users-record is_admin / is_superadmin — a user PAT
        of an admin works; this is NOT the session-only admin
        console gate). System PATs and everyone else get 403.
      parameters:
      - description: cd_ discussion id
        in: path
        name: discussion_id
        required: true
        type: string
      - description: '{status, reason}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: missing reason / bad status
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change discussion status
      tags:
      - Comments
  /api/downloader/fetch:
    post:
      consumes:
      - application/json
      description: |-
        Parses each input line (DOI, arXiv id, or paper URL),
        resolve-or-mints it into the registry and enqueues the
        multi-paradigm acquisition ladder (arXiv direct → OA
        APIs → publisher URL patterns → landing page → LLM
        agent fallback). Every fetched body is validated (%PDF-
        magic, trailer, size bounds, HTML-disguise classification)
        before it is stored and the MinerU pipeline is triggered.
        Track progress via GET /api/downloader/jobs or the paper
        detail acquisition block. Requires papers:write.
      parameters:
      - description: '{items: [\'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: '{items: [{input, kind, paper_id?, created, error?}], enqueued}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: downloader or registry not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Robust download (enqueue)
      tags:
      - Downloader
  /api/downloader/jobs:
    get:
      description: |-
        In-process snapshot of downloader jobs (active + recent
        terminal): per-paper state/phase, the winning strategy,
        the full attempt trace and healthz-style counters. The
        SPA's Robust Downloader page polls this every 2s while
        jobs are active. Requires papers:read.
      produces:
      - application/json
      responses:
        "200":
          description: '{jobs: [...], counters: {queued, in_flight, succeeded, failed,
            skipped}}'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Downloader jobs
      tags:
      - Downloader
  /api/downloader/remote-jobs:
    get:
      description: |-
        PostgreSQL-persisted snapshot of outbound fleet tasks (most
        recently updated first, capped at 500): id, worker_id, state
        (queued/running/staged/done/failed), identifier and error.
        Unlike /api/downloader/jobs this survives server restarts.
        Answers 200 with {enabled: false, jobs: []} when the remote
        fleet is disabled. Requires papers:read.
      produces:
      - application/json
      responses:
        "200":
          description: '{enabled: bool, jobs: [{id, worker_id, state, identifier,
            error?, updated_at}]}'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Downloader remote jobs
      tags:
      - Downloader
  /api/health:
    get:
      description: |-
        Liveness plus parallel dependency probes (rawstore, postgres,
        registry). HTTP status is always 200; read data.status for the
        real verdict ("healthy" | "degraded").
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - System
  /api/me:
    get:
      description: |-
        Returns the signed-in user's profile:
        {id, email, name, avatar, github_login, gitea_login,
        github_bound, gitea_bound, is_admin, is_superadmin,
        created}.
        avatar is the PocketBase file name — build the URL via the
        PocketBase files API. *_bound reports which OAuth2
        identities are linked to the record (the dashboard's
        account-binding panels).
      produces:
      - application/json
      responses:
        "200":
