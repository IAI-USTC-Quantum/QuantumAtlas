      summary: List source/revision-pinned paper images
      tags:
      - Papers
  /api/papers/{paper_id}/parses:
    get:
      description: |-
        Parse revisions of a paper: each row is one immutable
        parse artifact (schema + schema_version + artifact
        sha256) bound to the source it was parsed from. A
        re-parse inserts a new revision and flips the
        is_current pointer (current_revision_id); old artifacts
        keep serving unchanged bytes. Requires login or
        papers:read.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
        in: path
        name: paper_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{paper_id, parses:[{revision_id,source_id,schema,schema_version,artifact_sha256,is_current,created_at,json_endpoint,blocks_endpoint}],
            current_revision_id}'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no such paper
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List parse revisions (block comments)
      tags:
      - BlockComments
  /api/papers/{paper_id}/parses/{revision}/blocks:
    get:
      description: |-
        Top-level blocks of one immutable parse revision, in
        stable (page_idx, block index) order. Block indexes are
        the parse's own public 1-based numbers and may be
        non-contiguous (1,2,5,...); gaps are real — never
        renumbered. page_idx is the original 0-based page index
        (page_no in each item is the public 1-based number).
        cursor is the opaque next_cursor token (keyset on the
        last emitted block); per_page defaults to 20, max 100.
        Requires paper_access.enabled plus login/papers:read, including historical revisions and qa_ identities; disabled is 404.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
        in: path
        name: paper_id
        required: true
        type: string
      - description: parse revision id
        in: path
        name: revision
        required: true
        type: string
      - description: 'filter: exact 0-based page index'
        in: query
        name: page_idx
        type: integer
      - description: keyset cursor from next_cursor
        in: query
        name: cursor
        type: string
      - description: page size (default 20, max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{paper_id,revision_id,schema,schema_version,blocks:[{page_idx,block_index,page_no,type,content,bbox,has_bbox,raw}],next_cursor}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: bad query parameter
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no such revision / bytes missing
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: artifact fails a supported original Middle profile (DocVortex
            2.0 or native pdf_info-v1)
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry or store unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List parse blocks (keyset)
      tags:
      - BlockComments
  /api/papers/{paper_id}/parses/{revision}/blocks/{page_idx}/{block_index}:
    get:
      description: |-
        Combined read of ONE block: source (paper + source PDF
        identity + parse revision identity) + anchor (the
        permanent comment anchor: canonical qa_, source_id,
        parse_revision, schema, page_idx, block_index) +
        content (the block's parsed value, original JSON under
        raw) + discussions. Block lookup is EXACT on
        (page_idx, block index): a non-contiguous index gap or a
        page the parse lacks answers 404 — never a
        nearest-block fallback. The same visual text under two
        parses of one PDF is TWO distinct anchors; comments
        never migrate between revisions. Original block content requires
        paper_access.enabled plus login/papers:read for all IDs; comment
        metadata does not provide an original-content gate bypass.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
        in: path
        name: paper_id
        required: true
        type: string
      - description: parse revision id
        in: path
        name: revision
        required: true
        type: string
      - description: 0-based page index
        in: path
        name: page_idx
        required: true
        type: integer
      - description: 1-based public block index (exact)
        in: path
        name: block_index
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{source, anchor, content, discussions, discussions_ready,
            next_cursor}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: malformed block path
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no such revision or block (exact-index semantics)
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: artifact fails a supported original Middle profile (DocVortex
            2.0 or native pdf_info-v1)
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry or store unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Read one block (combined)
      tags:
      - BlockComments
  /api/papers/{paper_id}/parses/{revision}/blocks/{page_idx}/{block_index}/image:
    get:
      description: |-
        A PNG crop of the ORIGINAL source PDF page rendered and
        clipped to the block's [0,1]-normalized bbox — a real
        page region, never a redraw of the parsed text. Honest
        failures, never a fabricated image: the block carries
        no bbox → 404 reason=no_bbox; the source PDF bytes are
        missing → 404 reason=source_missing; the page is beyond
        the source PDF → 404 reason=page_out_of_range; no PDF
        rasterizer installed on the server → 503
        reason=renderer_unavailable (operators install
        poppler-utils or set paper_access.block_image_command;
        resolution via paper_access.block_image_dpi, default
        150). ETag is deterministic over (source sha, page,
        bbox, dpi). Requires paper_access.enabled plus login/papers:read, including historical sources; Range/aliases do not bypass the gate.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
        in: path
        name: paper_id
        required: true
        type: string
      - description: parse revision id
        in: path
        name: revision
        required: true
        type: string
      - description: 0-based page index
        in: path
        name: page_idx
        required: true
        type: integer
      - description: 1-based public block index (exact)
        in: path
        name: block_index
        required: true
        type: integer
      produces:
      - image/png
      responses:
        "200":
          description: PNG crop of the rendered original page
          schema:
            type: file
        "400":
          description: malformed block path
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no_bbox | source_missing | page_out_of_range | no such revision/block
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: artifact fails a supported original Middle profile (DocVortex
            2.0 or native pdf_info-v1)
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: renderer_unavailable | registry or store unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get block image (original-page crop)
      tags:
      - BlockComments
  /api/papers/{paper_id}/parses/{revision}/files/{path}:
    get:
      description: Requires paper_access.enabled and papers:read; serves the exact
        original relative member path, including nested directories and all JSON/Markdown/images/unknown
        valid files. No renaming, flattening or JSON reserialization. Verifies the
        complete published manifest/source/members and the selected member SHA before
        bytes; exact pins never fall back. Unknown/untrusted types use attachment+nosniff,
        allowlisted raster images may be inline. Generated manifest lives separately
        from producer files. No raw S3 presigns.
      parameters:
      - description: paper id or resolvable alias
        in: path
        name: paper_id
        required: true
        type: string
      - description: immutable complete parse revision
        in: path
        name: revision
        required: true
        type: string
      - description: original producer relative member path, may contain /; as listed
          by manifest
        in: path
        name: path
        required: true
        type: string
      - description: optional exact source consistency pin
        in: query
        name: source_id
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: byte-exact original member; ETag is member SHA-256
          schema:
            type: file
        "400":
          description: unsafe member path
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: disabled, pins missing or member not in manifest
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: source/revision conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: bundle/source/member integrity failure
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: backend unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a producer-original immutable bundle member
      tags:
      - Papers
  /api/papers/{paper_id}/parses/{revision}/json:
    get:
      description: |-
        The ORIGINAL Middle JSON artifact bytes of one parse
        revision — not a re-serialization. ETag /
        X-QAtlas-Sha256 carry the artifact sha256 the revision
        row pins; the server verifies the stored bytes against
        it before serving (a mismatch is a 500, never silent).
        Revisions are immutable: the bytes for a revision_id
        never change. Requires paper_access.enabled plus login/papers:read. Historical pinned Middle remains available for old comments, but is not evidence that a new complete bundle is ready; use /read for the derived view or /manifest and /files/{path} for all producer originals.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
