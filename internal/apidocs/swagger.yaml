  /api/papers/{paper_id}/sources/{source_id}/pdf:
    get:
      description: |-
        The ORIGINAL PDF bytes of one source, hash-verifiable
        via ETag / X-QAtlas-Sha256 (= the row's sha256). Range
        requests are honoured with the SAME authentication as
        full GETs. ?version=vN is a pin, not a hint: on mismatch
        with the source's own origin the answer is 404 — the
        server never substitutes a newer version or the journal
        edition. Requires paper_access.enabled even for historical
        sources; /api/papers/{id}/pdf is the direct alias-aware source-pin entry point.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
        in: path
        name: paper_id
        required: true
        type: string
      - description: source id from the sources list
        in: path
        name: source_id
        required: true
        type: string
      - description: 'pin: arXiv version, e.g. v2 — mismatch 404s, never substitutes'
        in: query
        name: version
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: PDF bytes (Range → 206)
          schema:
            type: file
        "206":
          description: partial content
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no such source / version pin mismatch / bytes missing
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry or store unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get source PDF bytes
      tags:
      - BlockComments
  /api/papers/lookup:
    get:
      description: |-
        Resolves comma-separated namespaced `kind:id` refs
        (arxiv:… / openalex:… / doi:…) against the local OpenAlex
        corpus. Returns per-ref {ref,title,authors,year,hosted,
        has_md,resolved} plus corpus_available — hosted reports
        whether QuantumAtlas hosts the ref, and has_md (meaningful
        only when hosted) whether its default asset carries
        converted markdown, so batch consumers learn both facts in
        one call (≤200 refs per batch). Exact-by-id only; fuzzy
        search is a separate deferred capability.
      parameters:
      - description: comma-separated kind:id refs
        in: query
        name: ids
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Resolve references (batch, exact)
      tags:
      - Papers
  /api/papers/match:
    post:
      consumes:
      - application/json
      description: |-
        Decides whether papers (qatlas-id / DOI / arXiv id /
        OpenAlex id / paper URL / title) are already inside the
        qatlas registry and returns the unified qa_… id.
        Precision-first: identifiers match exactly after strict
        normalization (trim / lowercase / known URL prefix /
        arXiv vN); titles match only when EVERY word matches
        (case-insensitive, order-insensitive). Merged papers
        resolve to the surviving paper. Free-form `inputs` are
        auto-detected per entry; the typed fields force a kind;
        author/year narrow ambiguous title matches.
        Upstream failures are never reported as empty matches: HTTP 504
        denotes timeout; HTTP 502 includes a stable code distinguishing
        transport, upstream HTTP and invalid response failures. Only the
        numeric upstream_status is exposed, never private upstream bodies.
      parameters:
      - description: '{inputs: [string], doi?, arxiv_id?, openalex_id?, qatlas_id?,
          url?, title?, author?, year?}'
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: '{results: [{input, kind, normalized, matched, qatlas_id, method,
            ambiguous, paper, candidates, truncated, reason}]}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: code, detail, optional numeric upstream_status
          schema:
            additionalProperties: true
            type: object
        "503":
          description: match backend disabled
          schema:
            additionalProperties:
              type: string
            type: object
        "504":
          description: match_upstream_timeout; no match result available
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Match paper identities against the registry
      tags:
      - Papers
  /api/papers/needs-mineru:
    get:
      parameters:
      - description: max results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Papers needing MinerU
      tags:
      - Papers
  /api/papers/source-register:
    post:
      consumes:
      - application/json
      description: 'Requires papers:write, registry/object storage and pdftotext.
        Accepts only public HTTPS URLs; every redirect and DNS destination is validated
        and pinned. The PDF title must match first-page front matter. No DOI is synthesized
        and distinct URLs are not title-merged. IACR ePrint landing/PDF forms share
        one eprint identity. Same work and SHA reuse an immutable source; changed
        bytes create a new source. No parse or Markdown is fabricated. HTTP Idempotency-Key
        response replay is not promised: check server state after a transport failure.
        At most two registrations acquire PDFs concurrently in one process; excess
        requests receive 503 with Retry-After before acquisition.'
      parameters:
      - description: source_url HTTPS original, title (max 2000 UTF-8 bytes), authors
          (1..100, max 500 bytes each), year (1..9999)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.externalSourceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{paper_id,created,external_id,source_url,source:{source_id,origin,sha256,size_bytes,created_at,source_url,retrieved_url,retrieved_at,pdf_endpoint}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid JSON, bibliographic fields or URL
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: requires papers:write
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: acquisition, size/format or title/provenance rejected
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: immutable storage/integrity or registration failure
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: catalog/storage unavailable or registration busy (Retry-After)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Register external PDF original
      tags:
      - Papers
  /api/papers/stats:
    get:
      description: |-
        Counts of PDFs, markdown, JSON and mineru-pending papers from
        the S3 paper index. Returns {available:false} when no S3
        backend is configured.
      produces:
