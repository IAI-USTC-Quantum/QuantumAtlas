basePath: /
definitions:
  routes.meUsageResponse:
    properties:
      limit:
        type: integer
      llm_tokens:
        type: integer
      metric:
        type: string
      today:
        type: integer
    type: object
  routes.oauthDeviceCodeRequest:
    properties:
      description:
        type: string
      expires_in_days:
        type: integer
      name:
        type: string
      scopes:
        items:
          type: string
        type: array
    type: object
  routes.oauthDeviceCodeResponse:
    properties:
      device_code:
        type: string
      expires_in:
        type: integer
      interval:
        type: integer
      user_code:
        type: string
      verification_uri:
        type: string
      verification_uri_complete:
        type: string
    type: object
  routes.oauthDeviceLookupResponse:
    properties:
      available_scopes:
        items:
          type: string
        type: array
      description:
        type: string
      expires_in_days:
        type: integer
      max_expiry_days:
        type: integer
      name:
        type: string
      scope_descriptions:
        additionalProperties:
          type: string
        type: object
      scopes:
        items:
          type: string
        type: array
      status:
        type: string
      user_code:
        type: string
    type: object
  routes.oauthDeviceTokenError:
    properties:
      error:
        type: string
    type: object
  routes.oauthDeviceTokenRequest:
    properties:
      device_code:
        type: string
    type: object
  routes.oauthDeviceTokenResponse:
    properties:
      expires_at:
        type: string
      name:
        type: string
      pat_id:
        type: string
      plaintext:
        type: string
      prefix:
        type: string
      scopes:
        items:
          type: string
        type: array
    type: object
  routes.oauthDeviceUserCodeBody:
    properties:
      user_code:
        type: string
    type: object
  routes.patCreateRequest:
    properties:
      description:
        type: string
      expires_in_days:
        description: 'REQUIRED: 1..MaxPATExpiryDays'
        type: integer
      name:
        type: string
      scopes:
        description: 'REQUIRED: may be empty for "no permissions"'
        items:
          type: string
        type: array
    type: object
  routes.patCreateResponse:
    properties:
      created:
        type: string
      description:
        type: string
      expires_at:
        type: string
      id:
        type: string
      name:
        type: string
      plaintext:
        type: string
      prefix:
        type: string
      scopes:
        items:
          type: string
        type: array
    type: object
  routes.patSummary:
    properties:
      created:
        type: string
      description:
        type: string
      expires_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        type: string
      prefix:
        type: string
      scopes:
        items:
          type: string
        type: array
    type: object
info:
  contact:
    name: QuantumAtlas
    url: https://quantum-atlas.ai
  description: |-
    Go + PocketBase backend for QuantumAtlas: paper
    collection + search + database. Write endpoints and
    the search/paper read surface require a bearer token
    (PAT or PocketBase session) plus the matching scope.
    See the auth model docs for the scope vocabulary.
  title: QuantumAtlas API
  version: "1.0"
paths:
  /api/admin/assets/{paper_id}:
    get:
      description: |-
        Admin-only asset listing: every PDF / markdown object the
        paper owns, with S3 object keys, sizes, SHA256s.
      parameters:
      - description: paper id (qa_...)
        in: path
        name: paper_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List paper assets
      tags:
      - Admin
  /api/admin/assets/{paper_id}/{kind}/download:
    get:
      description: 'Admin-only proxy stream with Content-Disposition: attachment.'
      parameters:
      - description: paper id
        in: path
        name: paper_id
        required: true
        type: string
      - description: pdf | markdown
        in: path
        name: kind
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: Download paper asset
      tags:
      - Admin
  /api/admin/assets/{paper_id}/{kind}/url:
    get:
      description: 'Admin-only: time-limited presigned URL for direct browser-to-S3.'
      parameters:
      - description: paper id
        in: path
        name: paper_id
        required: true
        type: string
      - description: pdf | markdown
        in: path
        name: kind
        required: true
        type: string
      - description: duration (default 1h, max 24h)
        in: query
        name: ttl
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Presigned asset URL
      tags:
      - Admin
  /api/admin/assets/search:
    get:
      description: 'Admin-only: find papers with at least one asset.'
      parameters:
      - description: search query
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Search papers with assets
      tags:
      - Admin
  /api/admin/db/schema:
    get:
      description: |-
        Read-only introspection of the QATLAS_POSTGRES_DSN database:
        every table in schema public (goose_db_version included,
        alphabetical) with row estimate, total size, columns
        (type/nullable/default/is_pk), indexes and constraints.
        Admin-only: session token + github_login on the
        QATLAS_ADMIN_GITHUB_LOGINS allowlist.
      produces:
      - application/json
      responses:
        "200":
          description: '{database, tables:[{name, row_estimate, total_size, columns,
            indexes, constraints}]}'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: admin only
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: postgres registry unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Postgres schema browser
      tags:
      - Admin
  /api/admin/devdoc/ticket:
    post:
      description: |-
        Returns {url} — a short-lived signed link into the admin-only
        dev-docs site (/devdoc). Opening it sets an HttpOnly cookie and
        redirects to the ticket-free URL; the cookie authorizes the
        docs for 12h. Admin-only: session token + github_login on the
        QATLAS_ADMIN_GITHUB_LOGINS allowlist.
      produces:
      - application/json
      responses:
        "200":
          description: '{url}'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: admin only
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: dev docs not bundled
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Dev-docs ticket
      tags:
      - Admin
  /api/admin/users:
    get:
      description: |-
        Every users record: {users:[{id, name, email, github_login,
        gitea_login, is_admin, is_superadmin, disabled, created,
        updated}], total}.
        Requires a session AND one of: is_admin, is_superadmin, or the
        config admin allowlist (userAdminGuard — PATs rejected).
      produces:
      - application/json
      responses:
        "200":
          description: '{users, total}'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: user management requires admin / PAT auth not accepted
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - Admin
  /api/admin/users/{id}:
    patch:
      consumes:
      - application/json
      description: |-
        Body is a JSON object with any of {"disabled": bool,
        "is_admin": bool} — at least one key required. disabled needs
        admin-or-above; is_admin needs superadmin (env-allowlist admins
        count as superadmin). Self-protection: nobody may disable
        themselves or change their own is_admin; admins cannot
        disable superadmins. is_superadmin is not patchable here.
      parameters:
      - description: users record id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: the updated user record
          schema:
            additionalProperties: true
            type: object
        "400":
          description: empty or invalid body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: role too low / self-protection
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: user not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user flags
      tags:
      - Admin
  /api/admin/whoami:
    get:
      description: |-
        Returns {login, is_admin, is_user_admin, is_superadmin}
        for the signed-in session user. login is the github_login,
        falling back to gitea_login when only that is stamped.
        is_admin is the config allowlist gate (ops dashboard);
        is_user_admin / is_superadmin mirror the /api/admin/users
        guard for the user-management nav. The SPA uses these to
        decide which admin surfaces to render; non-admins get false
        flags rather than a 403. Session-token auth only (PAT auth
        refused, same as /api/pat).
      produces:
      - application/json
      responses:
        "200":
          description: '{login, is_admin, is_user_admin, is_superadmin}'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: PAT auth not accepted
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Admin whoami
      tags:
      - Admin
  /api/downloader/fetch:
    post:
      consumes:
      - application/json
      description: |-
        Parses each input line (DOI, arXiv id, or paper URL),
        resolve-or-mints it into the registry and enqueues the
        multi-paradigm acquisition ladder (arXiv direct → OA
        APIs → publisher URL patterns → landing page → LLM
        agent fallback). Every fetched body is validated (%PDF-
        magic, trailer, size bounds, HTML-disguise classification)
        before it is stored and the MinerU pipeline is triggered.
        Track progress via GET /api/downloader/jobs or the paper
        detail acquisition block. Requires papers:write.
      parameters:
      - description: '{items: [\'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: '{items: [{input, kind, paper_id?, created, error?}], enqueued}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: downloader or registry not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Robust download (enqueue)
      tags:
      - Downloader
  /api/downloader/jobs:
    get:
      description: |-
        In-process snapshot of downloader jobs (active + recent
        terminal): per-paper state/phase, the winning strategy,
        the full attempt trace and healthz-style counters. The
        SPA's Robust Downloader page polls this every 2s while
        jobs are active. Requires papers:read.
      produces:
      - application/json
      responses:
        "200":
          description: '{jobs: [...], counters: {queued, in_flight, succeeded, failed,
            skipped}}'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Downloader jobs
      tags:
      - Downloader
  /api/health:
    get:
      description: |-
        Liveness plus parallel dependency probes (rawstore, postgres,
        registry). HTTP status is always 200; read data.status for the
        real verdict ("healthy" | "degraded").
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - System
  /api/me:
    get:
      description: |-
        Returns the signed-in user's profile:
        {id, email, name, avatar, github_login, gitea_login,
        github_bound, gitea_bound, is_admin, is_superadmin,
        created}.
        avatar is the PocketBase file name — build the URL via the
        PocketBase files API. *_bound reports which OAuth2
        identities are linked to the record (the dashboard's
        account-binding panels).
      produces:
      - application/json
      responses:
        "200":
          description: '{id, email, name, avatar, github_login, gitea_login, github_bound,
            gitea_bound, is_admin, is_superadmin, created}'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: PAT auth not accepted
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: My profile
      tags:
      - Me
  /api/me/search-keys:
    get:
      description: |-
        The caller's per-user third-party search API key inventory
        (backend name, masked hint, updated_at — never the key
        material). enabled=false means the server has no encryption
        secret configured and the whole feature is off. Session-only
        (same reasoning as /api/pat: a leaked PAT must not read the
        owner's third-party keys).
      produces:
      - application/json
      responses:
        "200":
          description: '{enabled: bool, keys: [{backend, hint, updated_at}]}'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: PAT auth not accepted
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List my search API keys
      tags:
      - Me
  /api/me/search-keys/{backend}:
    delete:
      description: |-
        Removes the caller's stored key for one backend (opaque 404
        when absent). Session-only.
      parameters:
      - description: backend name
        in: path
        name: backend
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{ok: true}'
          schema:
            additionalProperties:
              type: boolean
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: PAT auth not accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: key not found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: feature disabled
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete my search API key
      tags:
      - Me
    put:
      consumes:
      - application/json
      description: |-
        Upserts the caller's API key for one backend (AES-256-GCM
        encrypted at rest; injected into multi/agentic search calls
        on the caller's behalf). The backend must be a catalog
        backend with a user-key slot. 503 when the server has no
        encryption secret configured. Session-only.
      parameters:
      - description: backend name (e.g. ieee, tavily)
        in: path
        name: backend
        required: true
        type: string
      - description: '{key: string}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: '{ok: true}'
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: unknown backend / no user-key slot / empty key
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: PAT auth not accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: feature disabled
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Store my search API key
      tags:
      - Me
  /api/me/usage:
    get:
      description: |-
        Returns {metric, today, limit, llm_tokens} for the
        agentic-search surface: today's call count, the caller's
        effective daily limit (per-user override > plan >
        search.agentic.daily_limit) and the LLM tokens consumed
        today. Same metering shape as the agentic response's usage
        block.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.meUsageResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: PAT auth not accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: postgres registry unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: My usage
      tags:
      - Me
  /api/oauth/device/approve:
    post:
      consumes:
      - application/json
      description: |-
        Session-only (PAT auth rejected). Marks the pending request
        as approved so the next /token poll mints the PAT bound to
        the approving user.
      parameters:
      - description: user_code from /<lang>/device
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.oauthDeviceUserCodeBody'
      produces:
      - application/json
      responses:
        "200":
          description: '{\"status\":\"approved\"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Approve a device request
      tags:
      - OAuth Device
  /api/oauth/device/code:
    get:
      description: |-
        Session-only (PAT auth rejected). Returns the PAT spec
        (name, description, scopes, expires_in_days) tied to a
        pending user_code so the /<lang>/device page can show the
        user what they're about to approve.
      parameters:
      - description: short user code (with or without dashes)
        in: query
        name: user_code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.oauthDeviceLookupResponse'
        "400":
          description: invalid user_code
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Look up pending device request
      tags:
      - OAuth Device
    post:
      consumes:
      - application/json
      description: |-
        RFC 8628 §3.1. Anonymous (no auth) — the CLI uses this to
        obtain a device_code (kept secret, polled on /token) and a
        short user_code that the human enters on the SPA's
        /<lang>/device page after authenticating.
      parameters:
      - description: PAT spec to mint after approval
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.oauthDeviceCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.oauthDeviceCodeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start device authorization
      tags:
      - OAuth Device
  /api/oauth/device/deny:
    post:
      consumes:
      - application/json
      description: |-
        Session-only (PAT auth rejected). Marks the pending request
        as denied so the next /token poll returns "access_denied".
      parameters:
      - description: user_code from /<lang>/device
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.oauthDeviceUserCodeBody'
      produces:
      - application/json
      responses:
        "200":
          description: '{\"status\":\"denied\"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deny a device request
      tags:
      - OAuth Device
  /api/oauth/device/token:
    post:
      consumes:
      - application/json
      description: |-
        RFC 8628 §3.4 + §3.5. Anonymous. The CLI polls this with
        device_code at the published interval until the server
        returns the minted PAT plaintext (success) or an error
        string ("authorization_pending", "slow_down", "expired_token",
        "access_denied", "invalid_grant"). HTTP status is always
        400 on errors per the RFC so the CLI can switch on `error`.
      parameters:
      - description: device_code from /code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.oauthDeviceTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: minted PAT plaintext (returned exactly once)
          schema:
            $ref: '#/definitions/routes.oauthDeviceTokenResponse'
        "400":
          description: RFC 8628 error string
          schema:
            $ref: '#/definitions/routes.oauthDeviceTokenError'
      summary: Poll for PAT after device approval
      tags:
      - OAuth Device
  /api/papers:
    get:
      description: |-
        Paginated list of registry papers (merged tombstones
        excluded). has_md filters on converted markdown present on
        the paper's default asset (the "converted papers" page);
        status filters by lifecycle; q is a case-insensitive title
        substring. Sorted by created_at (default) or updated_at,
        descending. Requires the papers:read scope.
      parameters:
      - description: true = only papers with converted markdown on the default asset
        in: query
        name: has_md
        type: boolean
      - description: pending | ready | failed
        in: query
        name: status
        type: string
      - description: title substring (case-insensitive)
        in: query
        name: q
        type: string
      - description: 1-based page (default 1)
        in: query
