      - description: parse revision id
        in: path
        name: revision
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Middle JSON bytes (application/json)
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no such revision / bytes missing
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: stored bytes fail the pinned sha256
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry or store unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
