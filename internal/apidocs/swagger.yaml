      summary: Get parse JSON bytes
      tags:
      - BlockComments
  /api/papers/{paper_id}/parses/{revision}/manifest:
    get:
      description: 'Requires paper_access.enabled and papers:read; only published
        complete new bundles are accepted. Verifies exact frozen source, manifest
        and every original member before serving. Manifest is generated separately
        from originals: version,paper_id,source_id,revision_id,source_pdf_sha256,middle_path,markdown_path,files[{path,size_bytes,sha256}].
        Old historical Middle alone is not bundle readiness. Never repairs or falls
