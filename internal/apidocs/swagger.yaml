  /api/oauth/device/token:
    post:
      consumes:
      - application/json
      description: |-
        RFC 8628 §3.4 + §3.5. Anonymous. The CLI polls this with
        device_code at the published interval until the server
        returns the minted PAT plaintext (success) or an error
        string ("authorization_pending", "slow_down", "expired_token",
        "access_denied", "invalid_grant"). HTTP status is always
        400 on errors per the RFC so the CLI can switch on `error`.
      parameters:
      - description: device_code from /code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.oauthDeviceTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: minted PAT plaintext (returned exactly once)
          schema:
            $ref: '#/definitions/routes.oauthDeviceTokenResponse'
        "400":
          description: RFC 8628 error string
          schema:
            $ref: '#/definitions/routes.oauthDeviceTokenError'
      summary: Poll for PAT after device approval
      tags:
      - OAuth Device
  /api/papers:
    get:
      description: |-
        Paginated list of registry papers (merged tombstones
        excluded). has_md filters on converted markdown present on
        the paper's default asset (the "converted papers" page);
        status filters by lifecycle; q is a case-insensitive title
        substring; arxiv_id / doi / paper_id are exact-identity
        filters (arxiv_id may carry a version suffix and doi a
        URL prefix — both are canonicalized before matching).
        Sorted by created_at (default) or updated_at,
        descending. Requires the papers:read scope.
      parameters:
      - description: true = only papers with converted markdown on the default asset
        in: query
        name: has_md
        type: boolean
      - description: pending | ready | failed
        in: query
        name: status
        type: string
      - description: title substring (case-insensitive)
        in: query
        name: q
        type: string
      - description: exact arXiv id filter (version suffix optional)
        in: query
        name: arxiv_id
        type: string
      - description: exact DOI filter (URL prefix tolerated)
        in: query
        name: doi
        type: string
      - description: exact surrogate paper id (qa_...)
        in: query
        name: paper_id
        type: string
      - description: 1-based page (default 1)
        in: query
        name: page
        type: integer
      - description: page size (default 20, max 100)
        in: query
        name: per_page
        type: integer
      - description: created_at (default) | updated_at, descending
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{items:[{paper_id,arxiv_id,doi,title,status,has_pdf,has_md,image_count,created_at,updated_at}],
            total, page, per_page}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid query parameter
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List papers
      tags:
      - Papers
  /api/papers/{arxiv_id}/mineru-claim:
