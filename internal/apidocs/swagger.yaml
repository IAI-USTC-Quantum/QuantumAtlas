  /api/papers/{paper_id}/sources:
    get:
      description: |-
        Source PDF assets of a paper for the block-comments
        surface: each row pins one immutable byte-identity
        (origin label like arxiv:v2 / upload, sha256, size).
        The current_source_id / is_current pointer is derived
        from the paper's current parse revision (paper_sources
