  /api/papers/{arxiv_id}/upload-mineru:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Requires a COMPLETE supported original Middle AND markdown.md/full.md. Supported profiles are docvortex.middle/schema_version 2.0 and genuine native pdf_info[] layout.json (mineru.native.middle/pdf_info-v1); producer engine version is not the structural schema version. MD-only, ContentList-only, incomplete or invalid schema packages are 422. All valid producer-original relative paths/names/bytes, including every JSON and unknown file, are retained; originals are never renamed or reserialized. Traversal, absolute/backslash paths, duplicate names, symlinks, CRC/ZIP errors fail the whole archive. Limits: ZIP/member 128MiB, expanded aggregate 256MiB, at most 10000 files.
        Writes create-only revision-scoped files into the new content bucket, verifies frozen exact PDF and every persisted member, writes separate manifest LAST, then publishes through PG (required). Every reupload is a new immutable revision/current publication; overwrite never changes historical revisions. Raw ZIP retention is optional; verified members+manifest are mandatory. No deferred-success indexing.

        The {arxiv_id} slot also accepts a DOI for a published edition's exact already-uploaded PDF. Both paths share source-bound immutable bundle publication; there is no title/authors metadata override. PDF contribution establishes DOI metadata (see upload-pdf). A tier label records producer/request metadata, not proof of an executed provider quality mode.
      parameters:
      - description: arXiv identifier (with vN) OR DOI (10.x/...)
        in: path
        name: arxiv_id
        required: true
        type: string
      - description: legacy input accepted; never replaces a frozen source or published
          revision
        in: query
        name: overwrite
        type: boolean
      - description: client-computed zip sha256 (in-transit integrity check)
        in: query
        name: expected_sha256
        type: string
      - description: sha256 of the exact frozen PDF parsed; cross-checked before publication
        in: query
        name: pdf_sha256
        type: string
      - description: legacy input; DOI metadata belongs to PDF contribution, not a
          parse metadata override
        in: query
        name: verify
        type: string
      - description: producer/contributor run label
        in: query
        name: source
        type: string
      - description: exact source id under this paper; source/version must match
        in: query
        name: source_id
        type: string
      - description: producer metadata label; default standard, not legacy model_version
        in: query
        name: tier
        type: string
      - description: complete supported Middle + Markdown ZIP; all original members
          retained
        in: formData
        name: mineru_zip
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: '{paper_id,source_id,source_sha256,revision_id,revision,is_current,tier,schema,schema_version,artifact_sha256,manifest_sha256,manifest,read_endpoint,blocks_endpoint}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: malformed upload or source PDF SHA mismatch
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: upload exact source PDF first
          schema:
            additionalProperties: true
            type: object
        "409":
          description: source/version identity conflict
          schema:
            additionalProperties: true
            type: object
        "413":
          description: multipart ZIP byte cap exceeded
          schema:
            additionalProperties: true
            type: object
        "422":
          description: unsupported/incomplete package or integrity failure
          schema:
            additionalProperties: true
            type: object
        "503":
          description: PG/object store unavailable; no deferred success
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload paper MinerU bundle (arXiv id or DOI)
      tags:
      - Papers
  /api/papers/{arxiv_id}/upload-pdf:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Freeze exact PDF bytes into the new content bucket and publish the alias/source identity through PostgreSQL (PG required, no deferred-success indexing). 200 for the same bound alias/SHA, 201 for a new frozen binding. The identifier alias is permanently bound to the first successful exact PDF: different bytes return 409 EVEN with overwrite=true. Same paper/SHA may reuse a source ID; semantic arXiv vN is not S3VersionId. Never mutate an old source or parse revision.

        The {arxiv_id} slot also accepts a DOI (`10.<registrant>/<suffix>`)
        for contributing a *published* version that may have no arXiv
        preprint. DOI PDF bytes also use immutable content/{paper}/{source}/source.pdf;
        its canonical import alias is separate from arXiv vN. The server resolves the DOI's title / authors /
        linked arxiv id from OpenAlex — the contributor cannot supply
        that metadata. The result is reported in `X-QAtlas-Verification`
        and the JSON `verification` block; `verify=strict` rejects a
        doi-not-found with 409 (or metadata-unavailable / unconfigured
        with 503).
      parameters:
      - description: arXiv identifier (with vN) OR DOI (10.x/...)
        in: path
        name: arxiv_id
        required: true
        type: string
      - description: legacy input accepted; never replaces a frozen source or published
          revision
        in: query
        name: overwrite
        type: boolean
      - description: client-computed PDF sha256 (in-transit guard)
        in: query
        name: expected_sha256
        type: string
      - description: 'DOI only: ''strict'' rejects when OpenAlex cannot resolve the
          DOI (default warn)'
        in: query
        name: verify
        type: string
      - description: PDF file
        in: formData
        name: pdf
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: unchanged
          schema:
            additionalProperties: true
            type: object
        "201":
          description: created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "409":
          description: frozen alias conflict, including overwrite=true
          schema:
            additionalProperties: true
            type: object
        "413":
          description: PDF byte cap exceeded
          schema:
            additionalProperties: true
            type: object
        "422":
          description: frozen source integrity failure
          schema:
            additionalProperties: true
            type: object
        "503":
          description: PG/object store unavailable; no deferred success
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload paper PDF (arXiv id or DOI)
      tags:
      - Papers
  /api/papers/{id_or_doi}/images/zip:
    get:
      description: Requires paper_access.enabled and papers:read for every identity.
        Uses verified original members of a complete immutable bundle; legacy image
        buckets/ZIPs are ignored. Preserves producer-relative member names/bytes.
        No-pin missing content may return 202 and start lazy parsing; poll the shared
        pure read/status until ready then re-GET pinned source/revision. Does not
        expose NAS/S3 presigns.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
