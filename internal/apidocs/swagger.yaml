            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: disabled or exact pins/members missing
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get source/revision-pinned images ZIP
      tags:
      - Papers
  /api/papers/{id_or_doi}/markdown:
    get:
      description: |-
        Requires paper_access.enabled and papers:read for canonical IDs and aliases. Uses a verified complete immutable bundle of the exact frozen source, not legacy MD/JSON/images. Original Markdown bytes are preserved (this is not /read's derived JSON). Missing no-pin content may start lazy parsing and return 202; explicit pins never repair/fall back. Only content access triggers inference, never nightly/boot/ingest.
        format=link returns an authenticated same-origin /parses/{revision}/files/{original_path} locator, not a private NAS/S3 presign. Every follow-up download remains gated/authenticated. Poll Operation-Location read/status until verified ready, then re-GET with source/revision pins.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
        in: path
        name: id_or_doi
        required: true
        type: string
      - description: exact frozen source; mutually exclusive with version
        in: query
        name: source_id
        type: string
      - description: exact semantic arXiv vN
        in: query
        name: version
        type: string
      - description: immutable complete parse revision
        in: query
        name: revision
        type: string
      - description: bytes (default) or authenticated internal link
        in: query
        name: format
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: original Markdown bytes or source/revision-pinned link JSON
          schema:
            type: string
        "202":
          description: pending source-specific parsing
          headers:
            Operation-Location:
              description: pure readiness poll URL
              type: string
            Retry-After:
              description: poll delay in seconds
              type: string
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: disabled or exact pins/members missing
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: source/revision conflict
          schema:
