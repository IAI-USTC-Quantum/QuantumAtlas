      - PAT
  /api/search:
    post:
      consumes:
      - application/json
      description: |-
        Fans one search entry out to the configured providers
        (catalog / arxiv / openalex / remote), merges hits by paper
        identity (DOI > arXiv > title hash) and resolve-or-mints each
        identity-anchored hit against the paper registry. Newly minted
        papers carry created=true and are picked up by the lazy
        ingestion pipeline; title-only hits return as un-minted
        candidates. Requires the papers:read scope.
      parameters:
      - description: search entry {text?, title?, doi?, arxiv_id?, max_results?, required_phrases?}
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: '{results:[{paper_id,hit,created}], candidates:[...]}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Search papers
      tags:
      - Search
  /api/search/backends:
    get:
      description: |-
        The backend catalog for the search page's backend picker:
        the static table merged with the qatlas-search
        microservice's live availability (server_ready) and the
        caller's stored API keys (key_configured). selectable =
        server_ready || (user_key && key_configured) — key-requiring
        backends without a stored key render disabled. Session-only
        (key_configured is user-private).
      produces:
      - application/json
      responses:
        "200":
          description: '{remote, keys_enabled, backends: [{name, label, category,
            requires_key, user_key, server_ready, key_configured, selectable}]}'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List search backends
      tags:
      - Search
  /api/search/multi:
    post:
      consumes:
      - application/json
      description: |-
        Proxies one mode="multi" call to the qatlas-search
        microservice: every requested backend returns its own raw
        hit list (the source's own order), with NO cross-backend
        merge or ranking. The caller's stored third-party API keys
        (configured in the dashboard) are decrypted and forwarded so
        key-requiring backends run under the user's credentials.
        Requires the papers:read scope; 503 when search.remote is
        disabled; 502 when the microservice call fails.
      parameters:
      - description: '{text, max_results?, sources: [backend names]}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: '{results: {backend: [hits]}, usage, errors: {backend: msg},
            remote: true}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: upstream failed
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: search.remote disabled
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Multi-backend search (per-platform raw results)
      tags:
      - Search
  /api/server/info:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Server info
      tags:
      - System
  /api/v1/papers/{arxiv_id}/mineru-lease:
    post:
      description: Acquires the same MinerU processing lease returned by the claim
        path. The response body uses claim_id as the lease identifier.
      parameters:
      - description: arXiv identifier
        in: path
        name: arxiv_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: lease granted (body is the lease record; claim_id identifies
            the lease)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid arxiv_id
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: not claimable (no PDF in catalog, or markdown already exists)
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: already leased by someone else (body includes existing lease
            details)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: catalog unavailable (PostgreSQL unreachable)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Acquire MinerU processing lease
      tags:
      - Papers
  /api/v1/papers/{arxiv_id}/mineru-lease/{claim_id}:
    delete:
      description: Releases a MinerU processing lease by claim_id.
      parameters:
      - description: arXiv identifier
        in: path
        name: arxiv_id
        required: true
        type: string
      - description: claim id
        in: path
        name: claim_id
        required: true
        type: string
      responses:
        "204":
          description: lease released (empty body)
        "400":
          description: invalid arxiv_id
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: claim_id does not match the active lease
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: catalog unavailable (PostgreSQL unreachable)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Release MinerU lease
      tags:
      - Papers
  /api/v1/plugins:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List plugins
      tags:
      - Plugins
  /api/v1/plugins/{id}/disable:
