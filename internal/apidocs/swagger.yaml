  /api/rag/evidence:
    post:
      consumes:
      - application/json
      description: |-
        Same relay contract as /api/rag/retrieve but targeting
        qatlas-rag's POST /v1/evidence: body forwarded verbatim,
        reply streamed back as-is, 64 KiB cap, upstream errors
        forwarded with their own status. Requires the papers:read
        scope.
      parameters:
      - description: evidence query (qatlas-rag /v1/evidence schema)
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: the microservice's reply, relayed verbatim
          schema:
            additionalProperties: true
            type: object
        "400":
          description: body read failed
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: body exceeds 64 KiB
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: rag.remote disabled / microservice unreachable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: RAG evidence (proxied)
      tags:
      - RAG
  /api/rag/retrieve:
    post:
      consumes:
      - application/json
      description: |-
        Forwards the request body verbatim to qatlas-rag's
        POST /v1/retrieve (the retrieve request/response schema
        belongs to the qatlas-rag repository — qatlasd only
        authenticates the caller and relays, so schema changes
        never need a qatlasd release) and streams the reply back
        as-is. Bodies are capped at 64 KiB. rag.remote disabled →
        503 "rag service not configured"; microservice
        unreachable → 503 "rag unreachable: …"; a non-2xx
        upstream reply is forwarded with its own status + body so
        clients see the rag error schema. Requires the
        papers:read scope.
      parameters:
      - description: retrieve query (qatlas-rag /v1/retrieve schema)
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: the microservice's reply, relayed verbatim
          schema:
            additionalProperties: true
            type: object
        "400":
          description: body read failed
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: body exceeds 64 KiB
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: rag.remote disabled / microservice unreachable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: RAG retrieve (proxied)
      tags:
      - RAG
  /api/search:
    post:
      consumes:
      - application/json
      description: |-
        Fans one search entry out to the configured providers
        (catalog / arxiv / openalex / remote), merges hits by paper
        identity (DOI > arXiv > title hash) and resolve-or-mints each
        identity-anchored hit against the paper registry. Newly minted
        papers carry created=true as metadata only: search does not
        download papers or submit conversion tasks. Select identifiers
        explicitly via POST /api/downloader/fetch. Title-only hits return as un-minted
        candidates. The entry may carry an identity (arxiv_id / doi)
        instead of free text — identity fields are forwarded to the
        remote provider for identity-aware lookups; an entry with
        none of text / title / arxiv_id / doi is a 400. Each minted
        result also carries its hosting summary: has_md / has_pdf /
        status from the registry default asset (omitted when the
        registry is unavailable). Requires the papers:read scope.
      parameters:
      - description: search entry {text?, title?, doi?, arxiv_id?, max_results?, required_phrases?}
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: '{results:[{paper_id,hit,created,has_md?,has_pdf?,status?}],
            candidates:[...]}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid JSON or empty search entry
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Search papers
      tags:
      - Search
  /api/search/agentic:
    post:
      consumes:
      - application/json
      description: |-
        One multi-source search through the agentic backend
        (remote qatlas-search microservice or the local runner),
        optionally with an LLM conclusion ({"agent": false} skips
        it). The body is a search entry plus "agent" and "sources"
        extensions; identity fields (arxiv_id / doi / title) are
        forwarded so identity-only entries run identity lookups
        instead of an empty query — an entry with none of text /
        title / arxiv_id / doi is a 400 (before metering). Every
        call is metered per user per day (usage block); a failed
        upstream is refunded. Results mirror POST /api/search,
        including the has_md / has_pdf / status hosting summary
        on minted results. Anchoring is metadata-only; downloads require
        explicit POST /api/downloader/fetch. Requires the papers:read scope plus a
        user-bound credential (system PATs get 403).
      parameters:
      - description: '{text?, title?, doi?, arxiv_id?, max_results?, agent?, sources?}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: '{results:[{paper_id,hit,created,has_md?,has_pdf?,status?}],
            candidates:[...], conclusion, usage, errors}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid JSON or empty search entry
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: system PAT (no user to meter)
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: daily agentic limit reached
          schema:
            additionalProperties: true
            type: object
        "502":
          description: upstream failed (quota refunded)
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: no backend configured / registry unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Agentic search (metered)
      tags:
      - Search
  /api/search/backends:
    get:
      description: |-
        The backend catalog for the search page's backend picker:
        the static table merged with the qatlas-search
        microservice's live availability (server_ready) and the
        caller's stored API keys (key_configured). selectable =
        server_ready || (user_key && key_configured) — key-requiring
        backends without a stored key render disabled. Session-only
        (key_configured is user-private).
      produces:
      - application/json
      responses:
        "200":
          description: '{remote, keys_enabled, backends: [{name, label, category,
            requires_key, user_key, server_ready, key_configured, selectable}]}'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List search backends
      tags:
      - Search
  /api/search/multi:
    post:
      consumes:
      - application/json
      description: |-
        Proxies one mode="multi" call to the qatlas-search
        microservice: every requested backend returns its own raw
        hit list (the source's own order), with NO cross-backend
        merge or ranking. The caller's stored third-party API keys
        (configured in the dashboard) are decrypted and forwarded so
        key-requiring backends run under the user's credentials.
        Provide text or doi (at least one nonblank). A DOI-only request
        forwards doi with an empty query for identity-aware lookup;
        nonempty text retains text-search semantics when both are supplied.
        Identity-anchored hits (DOI / arXiv id) are resolve-or-
        minted as metadata only before the response, without downloads
        or conversion tasks, and carry the server-side
        enrichment paper_id / created / has_md / status (the
        hosting summary is omitted when the registry is
        unavailable). Title-only hits — no DOI, no arXiv id — are
        never minted and carry none of these fields.
        Requires the papers:read scope; 503 when search.remote is
        disabled; 502 when the microservice call fails.
      parameters:
      - description: '{text?, doi?, max_results?, sources: [backend names]}; text
          or doi is required'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: '{results: {backend: [{title, authors?, year?, doi?, arxiv_id?,
            url?, venue?, citations?, source, score, paper_id?, created?, has_md?,
            status?}]}, usage, errors: {backend: msg}, remote: true}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: upstream failed
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: search.remote disabled
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Multi-backend search (per-platform raw results)
      tags:
      - Search
  /api/search/ranked:
    post:
      consumes:
      - application/json
      description: |-
        Search anchors metadata only; downloading selected identifiers requires POST /api/downloader/fetch.
        Remote-only fused search with ranking=scorer and agent=false. Requires papers:read. Recompiles the supplied program on every request. No LLM calls. Preserves one globally ordered hit list including title-only candidates and custom score explanations; only returned identity-anchored hits are resolve-or-minted. Scores are neither normalized nor probabilities.
      parameters:
      - description: '{text:string,sources:[string],max_results?:1..100,scorer:{language:qatlas-expr-v1,filter?:string,score:string},explain?:boolean}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: '{hits:[...],ranking,usage,errors,remote:true}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Search using a confirmed custom scorer
      tags:
      - Search
  /api/search/scoring/capabilities:
    get:
      description: Remote-only DSL features, limits and generation_available. Browser
        session required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Scoring language capabilities
      tags:
      - Search
  /api/search/scoring/generate:
    post:
      consumes:
      - application/json
      description: Requires papers:read and a user-bound credential. Generates and
        compiles a qatlas-expr-v1 scorer without searching or ingesting. One successful
        generation consumes one shared Agentic daily unit; failures refund the unit
        while recording known token usage. At most one internal repair.
      parameters:
      - description: '{query:string, requirements:string}; each 1-4000 Unicode characters'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: '{scorer,summary,warnings,scorer_hash,feature_version,usage:{today,limit,llm_tokens}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
        "504":
          description: Gateway Timeout
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Generate a restricted scorer from natural language (metered)
      tags:
      - Search
  /api/search/survey:
    post:
      consumes:
      - application/json
      description: |-
        Results are anchored as metadata only, without downloads or conversion tasks; selected identifiers require POST /api/downloader/fetch.
        Keywords, author/year/venue/citation rules and agentic planning are owned by qatlas-search. Rules filter a bounded retrieved set, not an exhaustive corpus. Per-user backend keys are injected by qatlasd and cannot be supplied by callers.
      parameters:
      - description: '{goal, queries?, rules?: {authors?, venues?, year_from?, year_to?,
          min_citations?, sort?}, sources, max_results?, agentic?}; agentic=true uses
          existing daily quota'
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Plan and execute a bounded academic survey search
      tags:
      - search
  /api/server/info:
    get:
      description: |-
        Capability discovery: mode / version / engine plus a
        capabilities block — paper_access, markdown_delivery,
        pdf_delivery (always false — the /pdf endpoint answers
        410 by design), agentic_search, and a nested mineru
        object (enabled / on_demand). Privacy mirrors /api/health:
        anonymous callers see the booleans only; authenticated
        callers (system PAT or session) additionally get
        mineru.daily_cap and mineru.converted_today from the
        batch-scheduler snapshot. Note the quota semantics:
        daily_cap self-limits the nightly BATCH scheduler
        (default 4000/day, reserving headroom for interactive
        traffic); on-demand conversions triggered by GET
        /markdown are NOT counted against it — they only share
        the upstream per-token daily quota.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Server info
      tags:
      - System
  /api/v1/papers/{arxiv_id}/mineru-lease:
    post:
      description: Acquires the same MinerU processing lease returned by the claim
        path. The response body uses claim_id as the lease identifier.
      parameters:
      - description: arXiv identifier
        in: path
        name: arxiv_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: lease granted (body is the lease record; claim_id identifies
            the lease)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid arxiv_id
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: not claimable (no PDF in catalog, or markdown already exists)
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: already leased by someone else (body includes existing lease
            details)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: catalog unavailable (PostgreSQL unreachable)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Acquire MinerU processing lease
      tags:
      - Papers
  /api/v1/papers/{arxiv_id}/mineru-lease/{claim_id}:
    delete:
      description: Releases a MinerU processing lease by claim_id.
      parameters:
      - description: arXiv identifier
        in: path
        name: arxiv_id
        required: true
        type: string
      - description: claim id
        in: path
        name: claim_id
        required: true
        type: string
      responses:
        "204":
          description: lease released (empty body)
        "400":
          description: invalid arxiv_id
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: claim_id does not match the active lease
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: catalog unavailable (PostgreSQL unreachable)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Release MinerU lease
      tags:
      - Papers
  /api/v1/plugins:
    get:
      produces:
