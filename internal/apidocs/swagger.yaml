          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: comment store unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List block discussions
      tags:
      - Comments
    post:
      consumes:
      - application/json
      description: |-
        Creates a root discussion anchored at (parse_revision,
        page_idx, block_index) of the paper. actor and timestamps
        are recorded server-side; the optional `model` string is a
        pure client declaration. status may be set at creation
        (then `reason` is required) or omitted for a statusless
        note. Bodies are capped at comments.max_body_chars (default
        20000 Unicode chars, 413 beyond, never truncated); requests
        are capped at 1 MiB. Anchor misses 404 — never a
        nearest-block fallback. Idempotency-Key: same key + same
        request replays the original result; different request
        409s. Requires a user identity (session or user PAT) with
        comments:write — system PATs are read-only and get 403.
      parameters:
      - description: qa_ paper id
        in: path
        name: paper_id
        required: true
        type: string
      - description: replay key (SHA-256 of method+path+body compared)
        in: header
        name: Idempotency-Key
        type: string
      - description: '{parse_revision, page_idx, block_index, type?, scope?, status?,
          reason?, body, model?}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: system PAT / missing comments:write
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: anchor block not found in parse revision
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: idempotency key reused with different body
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: body / request over limit
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a discussion
      tags:
      - Comments
