            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: PAT auth not accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: feature disabled
          schema:
            additionalProperties:
              type: string
            type: object
