            type: object
        "403":
          description: PAT auth not accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: postgres registry unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: My usage
      tags:
      - Me
  /api/oauth/device/approve:
    post:
      consumes:
      - application/json
      description: |-
        Session-only (PAT auth rejected). Marks the pending request
        as approved so the next /token poll mints the PAT bound to
        the approving user.
      parameters:
      - description: user_code from /<lang>/device
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.oauthDeviceUserCodeBody'
      produces:
      - application/json
      responses:
        "200":
          description: '{\"status\":\"approved\"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Approve a device request
      tags:
      - OAuth Device
  /api/oauth/device/code:
    get:
      description: |-
        Session-only (PAT auth rejected). Returns the PAT spec
        (name, description, scopes, expires_in_days) tied to a
        pending user_code so the /<lang>/device page can show the
        user what they're about to approve.
      parameters:
      - description: short user code (with or without dashes)
        in: query
        name: user_code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.oauthDeviceLookupResponse'
        "400":
          description: invalid user_code
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Look up pending device request
      tags:
      - OAuth Device
    post:
      consumes:
      - application/json
      description: |-
        RFC 8628 §3.1. Anonymous (no auth) — the CLI uses this to
        obtain a device_code (kept secret, polled on /token) and a
        short user_code that the human enters on the SPA's
        /<lang>/device page after authenticating.
      parameters:
      - description: PAT spec to mint after approval
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.oauthDeviceCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.oauthDeviceCodeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start device authorization
      tags:
      - OAuth Device
  /api/oauth/device/deny:
    post:
      consumes:
      - application/json
      description: |-
        Session-only (PAT auth rejected). Marks the pending request
        as denied so the next /token poll returns "access_denied".
      parameters:
      - description: user_code from /<lang>/device
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.oauthDeviceUserCodeBody'
      produces:
      - application/json
      responses:
        "200":
          description: '{\"status\":\"denied\"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deny a device request
      tags:
      - OAuth Device
  /api/oauth/device/token:
    post:
      consumes:
      - application/json
      description: |-
        RFC 8628 §3.4 + §3.5. Anonymous. The CLI polls this with
        device_code at the published interval until the server
        returns the minted PAT plaintext (success) or an error
        string ("authorization_pending", "slow_down", "expired_token",
        "access_denied", "invalid_grant"). HTTP status is always
        400 on errors per the RFC so the CLI can switch on `error`.
      parameters:
      - description: device_code from /code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.oauthDeviceTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: minted PAT plaintext (returned exactly once)
          schema:
            $ref: '#/definitions/routes.oauthDeviceTokenResponse'
        "400":
          description: RFC 8628 error string
          schema:
            $ref: '#/definitions/routes.oauthDeviceTokenError'
      summary: Poll for PAT after device approval
      tags:
      - OAuth Device
  /api/papers:
    get:
      description: |-
        Paginated list of registry papers (merged tombstones
        excluded). has_md filters on converted markdown present on
        the paper's default asset (the "converted papers" page);
        status filters by lifecycle; q is a case-insensitive title
        substring; arxiv_id / doi / paper_id are exact-identity
        filters (arxiv_id may carry a version suffix and doi a
        URL prefix — both are canonicalized before matching).
        Sorted by created_at (default) or updated_at,
        descending. Requires the papers:read scope.
      parameters:
      - description: true = only papers with converted markdown on the default asset
        in: query
        name: has_md
        type: boolean
      - description: pending | ready | failed
        in: query
        name: status
        type: string
      - description: title substring (case-insensitive)
        in: query
        name: q
        type: string
      - description: exact arXiv id filter (version suffix optional)
        in: query
        name: arxiv_id
        type: string
      - description: exact DOI filter (URL prefix tolerated)
        in: query
        name: doi
        type: string
      - description: exact surrogate paper id (qa_...)
        in: query
        name: paper_id
        type: string
      - description: 1-based page (default 1)
        in: query
        name: page
        type: integer
      - description: page size (default 20, max 100)
        in: query
        name: per_page
        type: integer
      - description: created_at (default) | updated_at, descending
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{items:[{paper_id,arxiv_id,doi,title,status,has_pdf,has_md,image_count,created_at,updated_at}],
            total, page, per_page}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid query parameter
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List papers
      tags:
      - Papers
  /api/papers/{arxiv_id}/mineru-claim:
    post:
      parameters:
      - description: arXiv identifier
        in: path
        name: arxiv_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: claim granted (body is the claim record)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid arxiv_id
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: not claimable (no PDF in catalog, or markdown already exists)
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: already claimed by someone else (body includes existing claim
            details)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: catalog unavailable (PostgreSQL unreachable)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Claim MinerU processing
      tags:
      - Papers
  /api/papers/{arxiv_id}/mineru-claim/{claim_id}:
    delete:
      parameters:
      - description: arXiv identifier
        in: path
        name: arxiv_id
        required: true
        type: string
      - description: claim id
        in: path
        name: claim_id
        required: true
        type: string
      responses:
        "204":
          description: claim released (empty body)
        "400":
          description: invalid arxiv_id
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: claim_id does not match the active claim
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: catalog unavailable (PostgreSQL unreachable)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Release MinerU claim
      tags:
      - Papers
  /api/papers/{arxiv_id}/upload-mineru:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Accepts the entire MinerU result zip exactly as returned by `full_zip_url`. Server extracts `full.md` plus every `images/*` entry and stores them to the markdown and images object buckets respectively. Images are written before the markdown so any reader that observes the markdown also observes all referenced images. Replaces the v0.7.x `upload-markdown` endpoint (which only accepted a single .md file and silently dropped images).

        The {arxiv_id} slot also accepts a DOI (`10.<registrant>/<suffix>`) to contribute the converted *published* version. DOI bundles are stored under the `markdown/doi/...` + `images/doi/...` namespace; the server resolves canonical metadata (title, authors, linked arxiv id) from OpenAlex on the contributor's behalf — there is no `title` / `authors` form field. `verify=strict` rejects when OpenAlex cannot resolve the DOI (see upload-pdf). The result is reported in `X-QAtlas-Verification`.
      parameters:
      - description: arXiv identifier (with vN) OR DOI (10.x/...)
        in: path
        name: arxiv_id
        required: true
        type: string
      - description: overwrite on content conflict
        in: query
        name: overwrite
        type: boolean
      - description: client-computed zip sha256 (in-transit integrity check)
        in: query
        name: expected_sha256
        type: string
      - description: sha256 of the source PDF that was converted (cross-checked against
          stored PDF)
        in: query
        name: pdf_sha256
        type: string
      - description: 'DOI only: ''strict'' rejects when OpenAlex cannot resolve the
          DOI (default warn)'
        in: query
        name: verify
        type: string
      - description: short label of the contributor's MinerU run (truncated to 64
          chars)
        in: query
        name: source
        type: string
      - description: MinerU result zip (must contain full.md; optional images/*)
        in: formData
        name: mineru_zip
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload paper MinerU bundle (arXiv id or DOI)
      tags:
      - Papers
  /api/papers/{arxiv_id}/upload-pdf:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Content-addressed upload with sha256 idempotency. 200 when
        bytes are unchanged, 201 when written, 409 on a content
        conflict without overwrite=true.

        The {arxiv_id} slot also accepts a DOI (`10.<registrant>/<suffix>`)
        for contributing a *published* version that may have no arXiv
        preprint. DOI uploads are stored under a disjoint `pdf/doi/...`
        namespace and the server resolves the DOI's title / authors /
        linked arxiv id from OpenAlex — the contributor cannot supply
        that metadata. The result is reported in `X-QAtlas-Verification`
        and the JSON `verification` block; `verify=strict` rejects a
        doi-not-found with 409 (or metadata-unavailable / unconfigured
        with 503).
      parameters:
      - description: arXiv identifier (with vN) OR DOI (10.x/...)
        in: path
        name: arxiv_id
        required: true
        type: string
      - description: overwrite on content conflict
        in: query
        name: overwrite
        type: boolean
      - description: client-computed PDF sha256 (in-transit guard)
        in: query
        name: expected_sha256
        type: string
      - description: 'DOI only: ''strict'' rejects when OpenAlex cannot resolve the
          DOI (default warn)'
        in: query
        name: verify
        type: string
      - description: PDF file
        in: formData
        name: pdf
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: unchanged
          schema:
            additionalProperties: true
            type: object
        "201":
          description: created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload paper PDF (arXiv id or DOI)
      tags:
      - Papers
  /api/papers/{id_or_doi}/images/zip:
    get:
      description: |-
        Returns the images zip (application/zip) for the given
        arxiv id or DOI — the bundle the MinerU conversion
        produced alongside the markdown. The id may also be a
        qa_ paper_id (resolved to the canonical identity
        first). Only registered when
        QATLAS_PAPER_ACCESS_ENABLED=true on the server.

        Canonical resolution: same DOI-wins rule as
        /api/papers/{id_or_doi}/markdown; pass `?force_arxiv=1`
        to opt out per request.

        This endpoint has no long-running-operation semantics:
        when no images zip is stored it answers 404 (fetch
        /markdown first to trigger the conversion that produces
        the images).

        Transport (ADR 0011): defaults to a byte stream
        (application/zip). Pass `?format=link` to instead
        receive a JSON body with a short-lived RustFS direct
        link (`{images_url, format:"link", expires_in}`); on a
        backend that cannot presign (dev LocalStore) a link
        request transparently falls back to bytes. Any other
        ?format= value is a 400.
      parameters:
      - description: arXiv canonical id with vN suffix, or a DOI
        in: path
        name: id_or_doi
        required: true
        type: string
      - description: '1/true: bypass DOI-canonical default; return 409 if DOI has
          no arxiv twin'
        in: query
        name: force_arxiv
        type: string
      - description: link|bytes — override the default transport (images zip defaults
          to bytes)
        in: query
        name: format
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: images zip bytes (application/zip), or a JSON {images_url}
            when ?format=link
          schema:
            type: string
        "400":
          description: invalid arxiv_id or DOI, or invalid ?format= value
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no images available (fetch /markdown first to trigger conversion)
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: force_arxiv requested but DOI has no arxiv twin
          schema:
            additionalProperties: true
            type: object
        "503":
          description: DOI resolution unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get paper images zip
      tags:
      - Papers
  /api/papers/{id_or_doi}/markdown:
    get:
      description: |-
        Returns the cached MinerU markdown for the given arxiv id
        (or DOI — the id_or_doi path component is auto-detected
        against the IANA prefix `10.<registrant>/...`). A qa_
        paper_id is also accepted: the server resolves the
        surrogate to the paper's canonical identity (pinned to
        the highest ingested arXiv version; DOI-only papers are
        served from the DOI namespace). Only
        registered when QATLAS_PAPER_ACCESS_ENABLED=true on the
        server (default off).

        Canonical resolution: a `:PaperWork` node with
        `identifier_scheme='doi'` ALWAYS wins over its arxiv
        twin when both exist — DOI is the canonical identity of
        the published version. The dispatcher serves DOI bytes
        for either id form when a DOI contribution is on file;
        pass `?force_arxiv=1` to opt out per request (DOI input
        with force_arxiv + no arxiv twin returns 409). See
        docs/server/upload-api.md §Canonical resolution.

        Long-running operation semantics: on cache miss the
        server may transparently fetch the PDF from arxiv.org
        (silent_fetch) — or, for a DOI without an arXiv twin,
        from the open-access PDF URL OpenAlex surfaces
        (best_oa_location.pdf_url) — and trigger a MinerU
        conversion. The first call returns 202 with
        `Operation-Location:
        /api/papers/{id}/markdown/status` and `Retry-After: 5`;
        clients poll the status endpoint until state=cached then
        re-GET this resource for the bytes. A DOI with no arXiv
        twin and no OA PDF stays 404 (contribute the PDF via
        POST /api/papers/{doi}/upload-pdf).

        Transport (ADR 0011): markdown DEFAULTS to a byte stream
        (text/markdown). Pass `?format=link` to instead receive a
        JSON body with a short-lived RustFS direct link
        (`{markdown_url, format:"link", expires_in}`); on a backend
        that cannot presign (dev LocalStore) a link request
        transparently falls back to bytes.
      parameters:
      - description: arXiv canonical id with vN suffix, or a DOI (e.g. 10.1103/PhysRevLett.103.150502)
        in: path
        name: id_or_doi
        required: true
        type: string
      - description: '1/true: bypass the DOI-canonical default and serve the arxiv
          twin (or 409 if no twin exists)'
        in: query
        name: force_arxiv
        type: string
      - description: link|bytes — override the default transport (markdown defaults
          to bytes)
        in: query
        name: format
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: markdown bytes (text/markdown), or a JSON {markdown_url} when
            ?format=link
          schema:
            type: string
        "202":
          description: long-running operation started; poll status_url
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid arxiv_id or DOI
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: DOI unknown to OpenAlex / no arXiv twin and no OA PDF (contrib
            upload possible); or paper unknown and silent fetch unavailable
          schema:
            additionalProperties: true
            type: object
        "409":
          description: force_arxiv requested but DOI has no arxiv twin
          schema:
            additionalProperties: true
            type: object
        "502":
          description: prior conversion failed inside the cooldown window, or OpenAlex
            upstream error
          schema:
            additionalProperties: true
            type: object
        "503":
          description: asset storage unavailable (code=asset_store_unavailable, retryable=true,
            Retry-After); cache-only mode or DOI resolution unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get paper markdown
      tags:
      - Papers
  /api/papers/{id_or_doi}/markdown/status:
    get:
      description: |-
        Side-effect-free poll surface. Never starts a job and
        never triggers a fetch. Only registered when
        QATLAS_PAPER_ACCESS_ENABLED=true on the server. Like the
        markdown endpoint, the id may be an arXiv id, a DOI, or
        a qa_ paper_id.

        Canonical resolution: same DOI-wins rule as
        /api/papers/{id_or_doi}/markdown. Pass `?force_arxiv=1`
        to query the arxiv-side status instead.

        Response shape always carries the agent-decision triple
        `state / pdf_ready / md_ready` plus an optional `phase`
        (fetching_pdf | converting_md | ready | error_fetching |
        error_converting) and `fetch` / `convert` sub-objects
        with bytes_received / mineru_task_id / polled_count so a
        polling client can show precise progress.
      parameters:
      - description: arXiv canonical id or DOI
        in: path
        name: id_or_doi
        required: true
        type: string
      - description: '1/true: bypass DOI-canonical default'
        in: query
        name: force_arxiv
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status payload (state ∈ cached|queued|running|none|failed|cooldown|unavailable)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: paper unknown and silent fetch unavailable
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: asset storage unavailable; retryable=true with Retry-After
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get markdown conversion status
      tags:
      - Papers
  /api/papers/{id_or_doi}/pdf:
    get:
      description: |-
        PDF delivery is disabled. This endpoint no longer
        serves PDF bytes (or direct links) in any state: it
        validates the id and always returns 410 Gone with
        `{"detail": "PDF delivery is disabled; use the markdown
        endpoint instead"}`. Use
        /api/papers/{id_or_doi}/markdown instead. The id may be
        an arXiv id, a DOI, or a qa_ paper_id (resolved to the
        canonical identity first). Only registered when
        QATLAS_PAPER_ACCESS_ENABLED=true on the server.
      parameters:
      - description: arXiv canonical id with vN suffix, or a DOI
        in: path
        name: id_or_doi
        required: true
        type: string
      - description: '1/true: bypass DOI-canonical default; return 409 if DOI has
          no arxiv twin'
        in: query
        name: force_arxiv
        type: string
      produces:
      - application/json
      responses:
        "400":
          description: invalid arxiv_id or DOI
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: force_arxiv requested but DOI has no arxiv twin
          schema:
            additionalProperties: true
            type: object
        "410":
          description: PDF delivery is disabled; use the markdown endpoint instead
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: OpenAlex upstream error (DOI dispatch)
          schema:
            additionalProperties: true
            type: object
        "503":
          description: DOI resolution unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get paper PDF (disabled — 410 Gone)
      tags:
      - Papers
  /api/papers/{id_or_doi}/pdf/status:
    get:
      description: |-
        Side-effect-free probe reporting the pdf_ready /
        md_ready booleans for a paper. Retained for debugging
        after PDF delivery was disabled (GET .../pdf answers
        410 Gone); the body no longer carries a pdf_url. The id
        may be an arXiv id, a DOI, or a qa_ paper_id. Only
        registered when QATLAS_PAPER_ACCESS_ENABLED=true.

        Canonical resolution: same DOI-wins rule as
        /api/papers/{id_or_doi}/markdown. Pass `?force_arxiv=1`
        to query the arxiv-side status instead.
      parameters:
      - description: arXiv canonical id or DOI
        in: path
        name: id_or_doi
        required: true
        type: string
      - description: '1/true: bypass DOI-canonical default'
        in: query
        name: force_arxiv
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status payload (state ∈ cached|queued|running|none|failed|unavailable)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: asset storage unavailable; retryable=true with Retry-After
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get PDF fetch status
      tags:
      - Papers
  /api/papers/{id}/figures:
    get:
      description: |-
        Groups the markdown's image references into figures:
        consecutive `![](images/<sha256>.<ext>)` lines form one
        multi-panel figure sharing a caption (searched up to 12
        lines below the group, then 4 lines above). Each figure
        reports its number, caption, the preceding prose line as
        context (≤200 runes) and its image files with sizes plus
        per-image download URLs; images no figure references come
        back as unmatched_images, and image_count is the total
        listed. Sizes come from the images zip's central
        directory (no member decompression) or the legacy
        per-paper directory listing. A paper with no markdown
        answers 200 with markdown_ready:false and empty figures
        (its conversion has not produced markdown yet). The id
        may be a qa_ surrogate, an arXiv id, or a DOI; arXiv/DOI
        forms are only dispatched when
        QATLAS_PAPER_ACCESS_ENABLED=true.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{paper_id, resolved_id, markdown_ready, figures:[{fig_no,
            caption, context, images:[{name,size,url}]}], unmatched_images:[{name,size,url}],
            image_count}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: unrecognized paper id
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no such paper
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get paper figures index
      tags:
      - Papers
  /api/papers/{id}/images/{name}:
    get:
      description: |-
        Serves a single MinerU-extracted image (content-addressed
        `<sha256>.<jpg|jpeg|png|gif|webp>`) without downloading
        the whole images zip — the URLs in the figures index and
        the images listing point here. Bytes come from the
        paper's images zip (member extracted in memory) or its
        legacy per-paper directory. Responses are immutable
        content-addressed files and carry
        `Cache-Control: public, max-age=86400`. The id may be a
        qa_ surrogate, an arXiv id, or a DOI; arXiv/DOI forms are
        only dispatched when QATLAS_PAPER_ACCESS_ENABLED=true.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
        in: path
        name: id
        required: true
        type: string
      - description: 'image file name: <sha256-hex>.<jpg|jpeg|png|gif|webp>'
        in: path
        name: name
        required: true
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: image bytes with the per-extension Content-Type
          schema:
            type: file
        "400":
          description: name is not a whitelisted image file name
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no such paper, or the paper's images hold no such member
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get paper image
      tags:
      - Papers
  /api/papers/{paper_id}:
    get:
      description: |-
        Returns the registry paper (status, identities) plus its
        asset rows. The id is the surrogate paper_id ("qa_" +
        ULID), an arXiv id (new or old style, with or without a
        vN suffix), or a DOI — identifier forms resolve against
        the registry; a valid identifier the server does not
        host answers 404 pointing at GET /api/papers/lookup for
        metadata resolution.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
        in: path
        name: paper_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get paper by id
      tags:
      - Papers
  /api/papers/{paper_id}/discussions:
    get:
      description: |-
        Issue-style discussion list for one paper, filtered by
        anchor (parse_revision / page_idx / block_index), content
        scope, type and status. Ordering is newest-first; the
        cursor is the last discussion_id of the page (keyset).
        scope=lean returns public+lean (the Lean view includes
        shared public discussion); status=none selects statusless
        notes. per_page defaults to 20, max 100. Requires
        papers:read or comments:read; system PATs may read.
      parameters:
      - description: qa_ paper id
        in: path
        name: paper_id
        required: true
        type: string
      - description: public|lean (lean includes public)
        in: query
        name: scope
        type: string
      - description: type slug, e.g. transcription_error
        in: query
        name: type
        type: string
      - description: pending|confirmed|retracted|none
        in: query
        name: status
        type: string
      - description: parse revision id
        in: query
        name: parse_revision
        type: string
      - description: 0-based page index
        in: query
        name: page_idx
        type: integer
      - description: 1-based public block index
        in: query
        name: block_index
        type: integer
      - description: keyset cursor (last discussion_id)
        in: query
        name: cursor
        type: string
      - description: page size (default 20, max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: comment store unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List block discussions
      tags:
      - Comments
    post:
      consumes:
      - application/json
      description: |-
        Creates a root discussion anchored at (parse_revision,
        page_idx, block_index) of the paper. actor and timestamps
        are recorded server-side; the optional `model` string is a
        pure client declaration. status may be set at creation
        (then `reason` is required) or omitted for a statusless
        note. Bodies are capped at comments.max_body_chars (default
        20000 Unicode chars, 413 beyond, never truncated); requests
        are capped at 1 MiB. Anchor misses 404 — never a
        nearest-block fallback. Idempotency-Key: same key + same
        request replays the original result; different request
        409s. Requires a user identity (session or user PAT) with
        comments:write — system PATs are read-only and get 403.
      parameters:
      - description: qa_ paper id
        in: path
        name: paper_id
        required: true
        type: string
      - description: replay key (SHA-256 of method+path+body compared)
        in: header
        name: Idempotency-Key
        type: string
      - description: '{parse_revision, page_idx, block_index, type?, scope?, status?,
          reason?, body, model?}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: system PAT / missing comments:write
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: anchor block not found in parse revision
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: idempotency key reused with different body
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: body / request over limit
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a discussion
      tags:
      - Comments
  /api/papers/{paper_id}/images:
    get:
      description: |-
        Lists the image objects of every asset of the paper,
        fetched on demand from the images bucket (no separate sync
        listing exists). Each asset reports kind "zip" (single
        images zip) or "dir" (per-paper directory) depending on the
        layout found, its files, and whether the 200-object cap
        truncated the listing. Empty files when the asset has no
        images. Requires the papers:read scope.
      parameters:
      - description: surrogate paper id (qa_...)
        in: path
        name: paper_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{paper_id, assets:[{asset_id, source, arxiv_version, kind,
            files:[{key,size}], truncated}]}'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List paper images
      tags:
      - Papers
  /api/papers/{paper_id}/parses:
    get:
      description: |-
        Parse revisions of a paper: each row is one immutable
        parse artifact (schema + schema_version + artifact
        sha256) bound to the source it was parsed from. A
        re-parse inserts a new revision and flips the
        is_current pointer (current_revision_id); old artifacts
        keep serving unchanged bytes. Requires login or
        papers:read.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
        in: path
        name: paper_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{paper_id, parses:[{revision_id,source_id,schema,schema_version,artifact_sha256,is_current,created_at,json_endpoint,blocks_endpoint}],
            current_revision_id}'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no such paper
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List parse revisions (block comments)
      tags:
      - BlockComments
  /api/papers/{paper_id}/parses/{revision}/blocks:
    get:
      description: |-
        Top-level blocks of one immutable parse revision, in
        stable (page_idx, block index) order. Block indexes are
        the parse's own public 1-based numbers and may be
        non-contiguous (1,2,5,...); gaps are real — never
        renumbered. page_idx is the original 0-based page index
        (page_no in each item is the public 1-based number).
        cursor is the opaque next_cursor token (keyset on the
        last emitted block); per_page defaults to 20, max 100.
        Requires login or papers:read.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
        in: path
        name: paper_id
        required: true
        type: string
      - description: parse revision id
        in: path
        name: revision
        required: true
        type: string
      - description: 'filter: exact 0-based page index'
        in: query
        name: page_idx
        type: integer
      - description: keyset cursor from next_cursor
        in: query
        name: cursor
        type: string
      - description: page size (default 20, max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{paper_id,revision_id,schema,schema_version,blocks:[{page_idx,block_index,page_no,type,content,bbox,has_bbox,raw}],next_cursor}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: bad query parameter
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no such revision / bytes missing
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: artifact fails the docvortex.middle v2.0 profile
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry or store unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List parse blocks (keyset)
      tags:
      - BlockComments
  /api/papers/{paper_id}/parses/{revision}/blocks/{page_idx}/{block_index}:
    get:
      description: |-
        Combined read of ONE block: source (paper + source PDF
        identity + parse revision identity) + anchor (the
        permanent comment anchor: canonical qa_, source_id,
        parse_revision, schema, page_idx, block_index) +
        content (the block's parsed value, original JSON under
        raw) + discussions. Block lookup is EXACT on
        (page_idx, block index): a non-contiguous index gap or a
        page the parse lacks answers 404 — never a
        nearest-block fallback. The same visual text under two
        parses of one PDF is TWO distinct anchors; comments
        never migrate between revisions. discussions is an
        empty placeholder until the Q2 comment API lands
        (discussions_ready=false). Requires login or
        papers:read.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
        in: path
        name: paper_id
        required: true
        type: string
      - description: parse revision id
        in: path
        name: revision
        required: true
        type: string
      - description: 0-based page index
        in: path
        name: page_idx
        required: true
        type: integer
      - description: 1-based public block index (exact)
        in: path
        name: block_index
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{source, anchor, content, discussions, discussions_ready,
            next_cursor}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: malformed block path
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no such revision or block (exact-index semantics)
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: artifact fails the docvortex.middle v2.0 profile
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry or store unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Read one block (combined)
      tags:
      - BlockComments
  /api/papers/{paper_id}/parses/{revision}/blocks/{page_idx}/{block_index}/image:
    get:
      description: |-
        A PNG crop of the ORIGINAL source PDF page rendered and
        clipped to the block's [0,1]-normalized bbox — a real
        page region, never a redraw of the parsed text. Honest
        failures, never a fabricated image: the block carries
        no bbox → 404 reason=no_bbox; the source PDF bytes are
        missing → 404 reason=source_missing; the page is beyond
        the source PDF → 404 reason=page_out_of_range; no PDF
        rasterizer installed on the server → 503
        reason=renderer_unavailable (operators install
        poppler-utils or set paper_access.block_image_command;
        resolution via paper_access.block_image_dpi, default
        150). ETag is deterministic over (source sha, page,
        bbox, dpi). Requires login or papers:read.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
        in: path
        name: paper_id
        required: true
        type: string
      - description: parse revision id
        in: path
        name: revision
        required: true
        type: string
      - description: 0-based page index
        in: path
        name: page_idx
        required: true
        type: integer
      - description: 1-based public block index (exact)
        in: path
        name: block_index
        required: true
        type: integer
      produces:
      - image/png
      responses:
        "200":
          description: PNG crop of the rendered original page
          schema:
            type: file
        "400":
          description: malformed block path
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no_bbox | source_missing | page_out_of_range | no such revision/block
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: artifact fails the docvortex.middle v2.0 profile
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: renderer_unavailable | registry or store unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get block image (original-page crop)
      tags:
      - BlockComments
  /api/papers/{paper_id}/parses/{revision}/json:
    get:
      description: |-
        The ORIGINAL Middle JSON artifact bytes of one parse
        revision — not a re-serialization. ETag /
        X-QAtlas-Sha256 carry the artifact sha256 the revision
        row pins; the server verifies the stored bytes against
        it before serving (a mismatch is a 500, never silent).
        Revisions are immutable: the bytes for a revision_id
        never change. Requires login or papers:read.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
        in: path
        name: paper_id
        required: true
        type: string
      - description: parse revision id
        in: path
        name: revision
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Middle JSON bytes (application/json)
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no such revision / bytes missing
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: stored bytes fail the pinned sha256
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry or store unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get parse JSON bytes
      tags:
      - BlockComments
  /api/papers/{paper_id}/sources:
    get:
      description: |-
        Source PDF assets of a paper for the block-comments
        surface: each row pins one immutable byte-identity
        (origin label like arxiv:v2 / upload, sha256, size).
        The current_source_id / is_current pointer is derived
        from the paper's current parse revision (paper_sources
        rows are append-only). The paper_id path segment may be
        a qa_ surrogate, an arXiv id, or a DOI — all resolve to
        the canonical qa_ (merged papers follow merged_into;
        the request alias is echoed via X-QAtlas-Requested-Id /
        X-QAtlas-Resolved-Id). Requires login or the
        papers:read scope.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
        in: path
        name: paper_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{paper_id, sources:[{source_id,origin,sha256,size_bytes,is_current,created_at,pdf_endpoint}],
            current_source_id}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: unrecognized id form
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no such paper
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List paper sources (block comments)
      tags:
      - BlockComments
  /api/papers/{paper_id}/sources/{source_id}/pdf:
    get:
      description: |-
        The ORIGINAL PDF bytes of one source, hash-verifiable
        via ETag / X-QAtlas-Sha256 (= the row's sha256). Range
        requests are honoured with the SAME authentication as
        full GETs. ?version=vN is a pin, not a hint: on mismatch
        with the source's own origin the answer is 404 — the
        server never substitutes a newer version or the journal
        edition. This is the block-comments reading surface; the
        legacy /api/papers/{id}/pdf route stays 410.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
        in: path
        name: paper_id
        required: true
        type: string
      - description: source id from the sources list
        in: path
        name: source_id
        required: true
        type: string
      - description: 'pin: arXiv version, e.g. v2 — mismatch 404s, never substitutes'
        in: query
        name: version
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: PDF bytes (Range → 206)
          schema:
            type: file
        "206":
          description: partial content
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no such source / version pin mismatch / bytes missing
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: registry or store unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get source PDF bytes
      tags:
      - BlockComments
  /api/papers/lookup:
    get:
      description: |-
        Resolves comma-separated namespaced `kind:id` refs
        (arxiv:… / openalex:… / doi:…) against the local OpenAlex
        corpus. Returns per-ref {ref,title,authors,year,hosted,
        has_md,resolved} plus corpus_available — hosted reports
        whether QuantumAtlas hosts the ref, and has_md (meaningful
        only when hosted) whether its default asset carries
        converted markdown, so batch consumers learn both facts in
        one call (≤200 refs per batch). Exact-by-id only; fuzzy
        search is a separate deferred capability.
      parameters:
      - description: comma-separated kind:id refs
        in: query
        name: ids
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Resolve references (batch, exact)
      tags:
      - Papers
  /api/papers/match:
    post:
      consumes:
      - application/json
      description: |-
        Decides whether papers (qatlas-id / DOI / arXiv id /
        OpenAlex id / paper URL / title) are already inside the
        qatlas registry and returns the unified qa_… id.
        Precision-first: identifiers match exactly after strict
        normalization (trim / lowercase / known URL prefix /
        arXiv vN); titles match only when EVERY word matches
        (case-insensitive, order-insensitive). Merged papers
        resolve to the surviving paper. Free-form `inputs` are
        auto-detected per entry; the typed fields force a kind;
        author/year narrow ambiguous title matches.
        Upstream failures are never reported as empty matches: HTTP 504
        denotes timeout; HTTP 502 includes a stable code distinguishing
        transport, upstream HTTP and invalid response failures. Only the
        numeric upstream_status is exposed, never private upstream bodies.
      parameters:
      - description: '{inputs: [string], doi?, arxiv_id?, openalex_id?, qatlas_id?,
          url?, title?, author?, year?}'
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: '{results: [{input, kind, normalized, matched, qatlas_id, method,
            ambiguous, paper, candidates, truncated, reason}]}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: code, detail, optional numeric upstream_status
          schema:
            additionalProperties: true
            type: object
        "503":
          description: match backend disabled
          schema:
            additionalProperties:
              type: string
            type: object
        "504":
          description: match_upstream_timeout; no match result available
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Match paper identities against the registry
      tags:
      - Papers
  /api/papers/needs-mineru:
    get:
      parameters:
      - description: max results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Papers needing MinerU
      tags:
      - Papers
  /api/papers/stats:
    get:
      description: |-
        Counts of PDFs, markdown, JSON and mineru-pending papers from
        the S3 paper index. Returns {available:false} when no S3
        backend is configured.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Paper statistics
      tags:
      - Papers
  /api/papers/status/batch:
    get:
      description: |-
        Folds the .../markdown/status agent-decision surface into
        one request: for each comma-separated id (qa_ surrogate,
        arXiv id, or DOI — de-duplicated, max 200) the entry
        carries requested_id, the resolved serving id (bare
        arXiv inputs pin to the highest ingested asset version),
        md_ready / pdf_ready store probes, the converter
        state machine's state/phase labels, the default asset's
        image_count, and an error field ("not found" for ids the
        registry does not host; "catalog unavailable" when
        PostgreSQL is down — per-entry, never failing the batch).
      parameters:
      - description: comma-separated paper ids (qa_... | arXiv id | DOI; max 200)
        in: query
        name: ids
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{results:[{requested_id, resolved_id, md_ready, pdf_ready,
            image_count, phase, state, error}]}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: missing or over-limit ids list
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Batch paper asset status
      tags:
      - Papers
  /api/pat:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
