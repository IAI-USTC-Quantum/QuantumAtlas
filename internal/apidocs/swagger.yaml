  /api/papers/status/batch:
    get:
      description: |-
        Folds the .../markdown/status agent-decision surface into
        one request: for each comma-separated id (qa_ surrogate,
        arXiv id, or DOI — de-duplicated, max 200) the entry
        carries requested_id, the resolved serving id (bare
        arXiv inputs pin to the highest ingested asset version),
        md_ready / pdf_ready store probes, the converter
        state machine's state/phase labels, the default asset's
        image_count, and an error field ("not found" for ids the
        registry does not host; "catalog unavailable" when
        PostgreSQL is down — per-entry, never failing the batch).
      parameters:
      - description: comma-separated paper ids (qa_... | arXiv id | DOI; max 200)
        in: query
        name: ids
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{results:[{requested_id, resolved_id, md_ready, pdf_ready,
            image_count, phase, state, error}]}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: missing or over-limit ids list
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Batch paper asset status
      tags:
      - Papers
  /api/pat:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/routes.patSummary'
            type: array
      security:
      - BearerAuth: []
      summary: List PATs
      tags:
      - PAT
    post:
      consumes:
      - application/json
      description: |-
        Mints a personal access token. Plaintext is returned exactly
        once. Requires a PocketBase session token (PAT auth is
        refused here, to stop a leaked PAT from self-replicating).
      parameters:
      - description: token spec
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.patCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.patCreateResponse'
        "400":
