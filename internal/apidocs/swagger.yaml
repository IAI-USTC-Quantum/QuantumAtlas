  /api/papers/{id}/read:
    get:
      description: |-
        Requires paper_access.enabled and papers:read. This is derived Markdown-reading JSON, NOT raw Middle or Structured Content. Returns paper_id/source_id/revision/source_sha256/artifact_sha256/bundle_sha256?/renderer/format/content, request_scope, content_ranges, truncated, next_request and warnings?. page and block are 1-based exact producer indexes (not array offsets); block requires page. limit is a Unicode content budget, default 30000, max 100000.
        An opaque cursor pins canonical paper/source/revision, PDF/Middle/bundle hashes, renderer and selection. Cursor-only resolves pins BEFORE selecting current; conflicting explicit pins/selectors are 409. Pinned failures never trigger repair, reparse, fallback or a current/latest substitution. Only content GET without a fixed revision/cursor may parse the selected verified source. source_id pins PDF, not a parse revision; absent PDF acquisition requires no source/revision/cursor pin. Old MD/JSON/images are ignored; legacy PDFs may be lazily frozen without deleting old storage.
        Pending work returns 202 + Operation-Location=/api/papers/{canonical}/read/status?source_id=S once the source is known (otherwise retains the exact requested DOI/arXiv identity), plus Retry-After. Poll status without starting another job; only verified complete bundle readiness, not process Done or historical Middle existence, permits re-GET with fixed source/revision.
      parameters:
      - description: 'paper id: qa_... | arXiv id | DOI'
        in: path
        name: id
        required: true
        type: string
      - description: exact PDF source id; mutually exclusive with version
        in: query
        name: source_id
        type: string
      - description: exact semantic arXiv vN source pin
        in: query
        name: version
        type: string
      - description: immutable parse revision pin
        in: query
        name: revision
        type: string
      - description: 1-based page number
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 1-based exact producer block index; requires page
        in: query
        minimum: 1
        name: block
        type: integer
      - description: opaque next_request.cursor; pinned revision loaded before current
        in: query
        name: cursor
        type: string
      - default: 30000
        description: Unicode character budget
        in: query
        maximum: 100000
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Middle-derived reading envelope; truncated=true includes next_request.cursor
          schema:
            additionalProperties: true
            type: object
        "202":
          description: source-pinned operation pending
          headers:
            Operation-Location:
              description: pure status poll URL
              type: string
            Retry-After:
              description: poll delay in seconds
              type: string
          schema:
            additionalProperties: true
            type: object
        "400":
          description: malformed query/cursor or invalid bounds
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: paper access disabled or exact pins/members missing
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: pin/selection/renderer/hash identity conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: frozen bytes or bundle integrity failure
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: backend or parser unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
