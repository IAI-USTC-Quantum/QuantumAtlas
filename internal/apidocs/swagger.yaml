        required: true
        type: string
      - description: exact source; mutually exclusive with version
        in: query
        name: source_id
        type: string
      - description: exact semantic arXiv vN
        in: query
        name: version
        type: string
      - description: complete immutable parse revision
        in: query
        name: revision
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: images ZIP assembled from verified original members
          schema:
            type: file
        "202":
          description: source-specific parse pending
          headers:
