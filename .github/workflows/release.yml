name: Publish qatlasd release

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: qatlasd-server-release
  cancel-in-progress: false

jobs:
  prep:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      # Resolve annotated tags to a commit for the reusable source/UI checks.
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    needs: prep
    uses: ./.github/workflows/go.yml
    with:
      source_sha: ${{ needs.prep.outputs.source_sha }}
      release_tag: ${{ github.ref_name }}

  release:
    needs: [prep, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.prep.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.checks.outputs.ui_artifact }}
          path: build/ui
      - name: Restore checked UI for the shared release binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 .github/scripts/artifacts.py restore-ui "build/ui/qatlasd_${VERSION}_web.zip" web/dist "$VERSION"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Native Git/SemVer validation, default preflight, GitHub Release and GHCR
      # publishing all belong to GoReleaser. There is no separate promotion gate.
      - name: Publish release and container images with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Do not select a different version when several tags share a commit.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
