name: docs

# Main-repository aggregation: the selected component docs are intentionally
# included in these artifacts. Credentials and application source are not.
# Deploy/update-docs.sh installs this content-only image into the existing
# qatlasd docs mount. No application image, database or RTD deployment is changed.
on:
  push:
    branches: [main]
    paths:
      - 'docsite/**'
      - '.github/workflows/docs.yml'
      - '.github/actions/checkout-docs/**'
      - '.github/scripts/build_docs.py'
      - '.github/scripts/build_docs.py.lock'
      - '.github/scripts/docs_sources.py'
      - '.github/scripts/check_docs.py'
      - '.github/scripts/docs-browser.cjs'
      - 'deploy/docs.Dockerfile'
      - 'deploy/update-docs.sh'
  pull_request:
    branches: [main]
    paths:
      - 'docsite/**'
      - '.github/workflows/docs.yml'
      - '.github/actions/checkout-docs/**'
      - '.github/scripts/*docs*'
      - 'deploy/docs.Dockerfile'
      - 'deploy/update-docs.sh'
  workflow_dispatch:

concurrency:
  group: qatlas-docs-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.30'
          python-version: '3.12'
      - uses: ./.github/actions/checkout-docs
        with:
          token: ${{ secrets.DOCS_READ_TOKEN }}
      - name: Build and verify both Sphinx sites
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          uv run --locked --script .github/scripts/build_docs.py --release
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p docs-dist
          cp -a web/public/doc web/public/devdoc docs-dist/
          git rev-parse HEAD > docs-dist/VERSION
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked browser test tools
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npm exec -- playwright install --with-deps chromium
      - name: Verify Furo, English/Chinese searches, navigation and diagrams
        run: node .github/scripts/docs-browser.cjs web/public build/docs-browser
      - name: Retain the exact checked document artifact
        uses: actions/upload-artifact@v4
        with:
          name: qatlas-docs-${{ github.sha }}
          path: docs-dist/
          retention-days: 14
          if-no-files-found: error
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-browser-${{ github.sha }}
          path: build/docs-browser/
          retention-days: 7
      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the checked content-only image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: docs-dist
          file: deploy/docs.Dockerfile
          push: true
          tags: |
            ghcr.io/iai-ustc-quantum/qatlas-docs:latest
            ghcr.io/iai-ustc-quantum/qatlas-docs:${{ github.sha }}
