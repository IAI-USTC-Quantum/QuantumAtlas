name: docs

# Builds the two sphinx sites (public /doc + admin /devdoc) and ships
# them as a content-only ghcr image, INDEPENDENT of the qatlasd release
# cycle. qatlasd serves whatever lives in its docs override directory
# (~/.qatlas/docs, see internal/routes/docs.go); deploy/update-docs.sh
# on the deploy host pulls this image and refreshes that directory —
# no server restart, no qatlasd redeploy.

on:
  push:
    branches:
      - main
    paths:
      - 'docsite/**'
      - '.github/workflows/docs.yml'
      - '.github/scripts/build-docs.sh'
      - 'deploy/docs.Dockerfile'
  workflow_dispatch:

# One publisher at a time so independent runs cannot race the latest image.
concurrency:
  group: qatlas-docs-publish
  cancel-in-progress: false

# Top-level permissions are read-only; the job opts in to packages:write
# for the ghcr push (same convention as release.yml).
permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write       # ghcr.io push

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs sites (public /doc + admin /devdoc)
        run: |
          set -euo pipefail
          python -m pip install -r docsite/requirements.txt
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          # Use the same clean two-site build as the release UI. Doctrees stay
          # under build/ and never enter the content-only image.
          bash .github/scripts/build-docs.sh
          mkdir -p docs-dist
          cp -a web/public/doc web/public/devdoc docs-dist/
          SHORT_SHA="$(git rev-parse --short HEAD)"
          printf '%s\n' "$SHORT_SHA" | tee docs-dist/VERSION
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN has push access to ghcr.io for the same repo
          # when `permissions: packages: write` is set above.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the content-only docs image
        uses: docker/build-push-action@v6
        with:
          context: docs-dist
          file: deploy/docs.Dockerfile
          push: true
          tags: |
            ghcr.io/iai-ustc-quantum/qatlas-docs:latest
            ghcr.io/iai-ustc-quantum/qatlas-docs:${{ env.SHORT_SHA }}
