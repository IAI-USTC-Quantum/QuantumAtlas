name: Go (build + vet + test)

# No paths filters: docs/web/release-only changes must still satisfy required
# checks. The reusable invocation checks the exact release commit, not main.
on:
  push:
    branches: [main, feat/go-server]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact commit to validate (defaults to the triggering SHA)
        type: string
        required: false
        default: ''
      release_tag:
        description: Exact SemVer release tag (empty for unpublished branch/PR UI fixtures)
        type: string
        required: false
        default: ''
    outputs:
      ui_artifact:
        description: Complete validated UI zip, reusable without rebuilding
        value: ${{ jobs.web.outputs.ui_artifact }}
      source_sha:
        description: Commit checked and embedded by this run
        value: ${{ jobs.web.outputs.source_sha }}

permissions:
  contents: read

env:
  CGO_ENABLED: '0'

jobs:
  go:
    name: Go (build + vet + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Verify exact source and no tracked build output
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git ls-files -- web/dist web/public/doc web/public/devdoc dist build qatlasd downloaderproxy downloaderworker)"
          test ! -d web/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Ordinary Go builds/tests do not need Node, Python packages or embedded UI.
      - name: Go formatting (tracked source only)
        run: |
          UNFORMATTED="$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "$UNFORMATTED" ]; then
            printf 'Run gofmt on these tracked files:\n%s\n' "$UNFORMATTED"
            exit 1
          fi
      - name: Go module graph synchronization
        run: go mod tidy -diff
      - name: Go vet
        run: go vet ./internal/... ./cmd/... ./tests/... ./web
      - name: Offline Go tests (including deployment and HTTP fixtures)
        run: go test ./internal/... ./cmd/... ./tests/... ./web
      - name: Compile opt-in integration tests without running live checks
        run: go test -tags=integration ./internal/... ./cmd/... -run '^$'
      - name: OpenAPI synchronization
        run: |
          go tool swag init -g main.go -d ./cmd/qatlasd,./internal/routes -o internal/apidocs --parseInternal --parseDepth 1
          git diff --exit-code -- internal/apidocs
          test -z "$(git status --porcelain --untracked-files=all -- internal/apidocs)"
      - name: Plain Go build without UI
        run: go build -o build/qatlasd ./cmd/qatlasd
      - name: CI-only artifact and release guard fixtures (no pytest)
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.1
          args: check

  docs:
    name: MkDocs (strict build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          # The existing revision-date plugin needs file history.
          fetch-depth: 0
      - name: Verify exact documentation source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install MkDocs toolchain
        run: python -m pip install -r docs/requirements.txt
      - name: Build MkDocs (RTD remains the publishing service)
        run: python -m mkdocs build --strict --site-dir build/mkdocs
      - name: Require a source-only clean checkout after documentation build
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  web:
    name: Web and complete UI reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ui_artifact: ${{ steps.source.outputs.ui_artifact }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          # Release UI checks need the exact tag, including annotated tags.
          fetch-depth: 0
      - name: Pin source and reproducible build environment
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 .github/scripts/artifacts.py ui-version
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "ui_artifact=qatlas-ui-$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo 'TZ=UTC' >> "$GITHUB_ENV"
          echo 'PYTHONHASHSEED=0' >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docsite/requirements.txt
      - name: Install Sphinx toolchain (not the retired Python application)
        run: python -m pip install -r docsite/requirements.txt
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Audit web dependencies (including build tools)
        working-directory: web
        run: npm audit
      - name: Lint web source
        working-directory: web
        run: npm run lint
      - name: Markdown and math security regression tests
        working-directory: web
        run: npm test
      - name: First clean Sphinx build (both sites)
        run: bash .github/scripts/build-docs.sh
      - name: First clean web build
        working-directory: web
        run: npm run build
      - name: Install Chromium for isolated UI tests
        working-directory: web
        run: npm exec -- playwright install --with-deps chromium
      - name: Browser math previews (mock APIs, loopback only)
        working-directory: web
        run: npm run test:browser
      - name: Preserve entire first output tree
        run: cp -a web/dist build/ui-first
      - name: Second clean Sphinx build (both sites, no doctree reuse)
        run: bash .github/scripts/build-docs.sh
      - name: Second clean web build
        working-directory: web
        run: npm run build
      - name: Compare all files including Sphinx timestamps, hidden files and removals
        run: |
          python3 .github/scripts/artifacts.py compare build/ui-first web/dist
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Package the same complete tree for release and Docker
        env:
          # Tag-derived for releases; SHA-only CI IDs are never published.
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          go run ./internal/cmd/uibundle -version "$VERSION" -output build/ui
          python3 .github/scripts/artifacts.py restore-ui "build/ui/qatlasd_${VERSION}_web.zip" build/ui-restored "$VERSION"
          python3 .github/scripts/artifacts.py compare web/dist build/ui-restored
      - name: Embedded Go build and UI tests
        run: |
          go test -tags=embedui ./web ./cmd/qatlasd/...
          go build -tags=embedui -o build/qatlasd-embedui ./cmd/qatlasd
      - name: Upload complete UI zip for this SHA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.source.outputs.ui_artifact }}
          path: build/ui/qatlasd_*_web.zip
          retention-days: 7
          if-no-files-found: error
