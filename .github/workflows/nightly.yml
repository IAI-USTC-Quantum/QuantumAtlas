name: Nightly production smoke

# Black-box checks of the real Go service and its embedded Web assets.
# Ordinary Go CI runs only the offline fixtures in tests/e2e/; the live
# checks require the explicit e2e build tag and configured targets.
#
# QATLAS_SERVER_TARGETS is the existing repository secret: comma- or
# newline-separated URL[|insecure][|token=...][|token-env=NAME] entries.
# Use a system PAT or session JWT for authenticated health details;
# regular user PATs do not grant that tier. Do not print the secret.
# Missing/invalid targets fail the live test instead of silently skipping.
# QATLAS_EXPECTED_VERSION is an optional repository variable: when set,
# both health and server-info must report that exact application version.

on:
  schedule:
    - cron: '0 18 * * *' # UTC 18:00 = 北京时间次日 02:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Hit live production targets (qatlasd)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run production smoke against configured targets
        env:
          QATLAS_SERVER_TARGETS: ${{ secrets.QATLAS_SERVER_TARGETS }}
          QATLAS_EXPECTED_VERSION: ${{ vars.QATLAS_EXPECTED_VERSION }}
        run: go test -tags=e2e ./tests/e2e -count=1 -timeout=10m
