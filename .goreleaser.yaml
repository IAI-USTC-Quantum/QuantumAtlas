version: 2
project_name: qatlasd

# OSS supports exact ignored tags; wildcard matching is a Pro feature.
# Keep the immutable Python retirement tag out of server version selection.
git:
  ignore_tags: [quantum-atlas-v0.21.0]

# Release bodies come only from GoReleaser's tag-range Git log (commit titles/SHA).
# dist/CHANGELOG.md is generated output, never a hand-maintained root input.
changelog:
  use: git

builds:
  - main: ./cmd/qatlasd
    env: [CGO_ENABLED=0]
    tags: [embedui]
    targets: [linux_amd64, linux_arm64, darwin_arm64]

# In v2.18.1 release.extra_files are added only during publishing, AFTER
# checksums. Both entries are needed: one checksums the UI, one uploads it.
# The validated UI artifact lives outside dist, which --clean removes.
# CI requires exactly the tag's zip before release. The glob also permits a
# local snapshot (whose generated version differs) to use a Git-SHA CI fixture UI.
checksum:
  extra_files:
    - glob: build/ui/qatlasd_*_web.zip

release:
  prerelease: auto
  extra_files:
    - glob: build/ui/qatlasd_*_web.zip

# Reuse the embedded-UI binaries above; buildx defaults to linux/amd64+arm64.
# Publication and preflight otherwise use GoReleaser's defaults.
dockers_v2:
  - images:
      - ghcr.io/iai-ustc-quantum/qatlasd
    dockerfile: Dockerfile.goreleaser
    tags:
      - "{{ .Tag }}"
      - "{{ .Version }}"
      - "{{ if and (not .Prerelease) (not .IsSnapshot) }}latest{{ end }}"
