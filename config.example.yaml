# QuantumAtlas server (qatlasd) — generated by `qatlasd config init`
#
# qatlasd reads ALL of its configuration from this YAML file
# (default: ~/.qatlas/config.yaml; override with --config /path/file.yaml).
# Environment-variable configuration is REJECTED: any QATLAS_* / MINERU_* /
# GITHUB_CLIENT_* variable set in the process environment makes startup
# fail with an error naming the offenders. Docker deployments bind-mount
# this file into the container read-only.
#
# **Server-only.** The Python client (`qatlas` CLI) reads its own YAML at
# ~/.config/qatlas/config.yaml (managed via `qatlas config init`).
#
# Keep this file mode 0600 — it holds secrets (S3 keys, OAuth secret,
# system PAT). After editing, restart the server:
#   systemctl restart qatlasd            # system service
#   systemctl --user restart qatlasd     # user service
#   docker compose restart qatlasd       # docker
# Then verify: `curl http://127.0.0.1:4200/api/health | jq`.

# ─── Bind address ──────────────────────────────────────────────────────
# HTTP bind (host:port). Default 127.0.0.1:4200 (loopback behind a
# reverse proxy). The docker image's CMD overrides with --http=0.0.0.0:4200.
# http_addr: 127.0.0.1:4200

# ─── Public URL ────────────────────────────────────────────────────────
# Canonical https origin this server is reachable at. Used to mint
# OAuth callback URLs and public-facing links.
# public_url: https://atlas.example.com

# ─── GitHub OAuth (required for browser login) ─────────────────────────
# Create an OAuth app at https://github.com/settings/developers
# (callback: https://<server>/api/oauth2-redirect). Fail-closed:
# if allowed_logins *and* admin_logins are both empty, nobody can sign
# in (deliberately locked default). Recovery: PocketBase superuser at /_/.
# auth:
#   github_client_id: ""
#   github_client_secret: ""
#   allowed_logins: [your-gh-login, teammate-gh-login]
#   admin_logins: [your-gh-login]

# ─── PostgreSQL (paper registry + OpenAlex corpus) ─────────────────────
# Without a DSN the paper registry degrades to {available:false} and
# /api/health reports registry: not_configured. goose migrations
# auto-apply at boot.
# postgres:
#   dsn: postgres://qatlas:secret@localhost:5432/qatlas?sslmode=disable
#   max_conns: 10
#   # Set false when pointing at a large pre-provisioned corpus (ADR 0013):
#   corpus_ensure_indexes: true

# ─── Object storage (RustFS / S3-compatible) ───────────────────────────
# All six connection fields must be set together or all omitted.
# Half-set config = `serve` refuses to start. When omitted, qatlasd
# falls back to a local filesystem store under paths.raw_dir —
# fine for dev, NOT recommended for prod.
# s3:
#   endpoint: https://rustfs.example.com        # must include scheme
#   bucket_pdf: qatlas-pdf
#   bucket_md: qatlas-md
#   bucket_images: qatlas-images
#   access_key_id: ""                            # svcacct, NEVER root keys
#   secret_access_key: ""
#   # Optional: separate public endpoint for presigned URLs:
#   public_endpoint: https://raw.example.com
#   # Optional: bucket for `qatlasd openalex bootstrap-pg` snapshots:
#   bucket_openalex: qatlas-openalex

# ─── Storage roots (defaults usually fine) ─────────────────────────────
# Defaults follow XDG: ${XDG_DATA_HOME:-~/.local/share}/qatlasd/{raw,data,pb_data}.
# In docker, set raw_dir: /data/raw and pb_data_dir: /data/pb_data.
# paths:
#   raw_dir: ""
#   data_dir: ""
#   pb_data_dir: ""

# ─── Docs override directory (not a config key) ────────────────────────
# ~/.qatlas/docs is NOT configured here — it is a fixed location. When it
# holds doc/ and/or devdoc/ subdirectories (populated by
# deploy/update-docs.sh), qatlasd serves /doc and /devdoc from disk
# instead of the docs embedded in the binary, so docs updates need no
# restart. Leave it empty/absent to keep serving the embedded copies.

# ─── System PAT (operator breakglass; optional) ────────────────────────
# Single bearer token, never lands in pb_data. Send as
# `Authorization: Bearer <token>`. Must be ≥16 chars or boot fails.
# Generate: `openssl rand -base64 32`. Empty token = feature off.
# system_pat:
#   token: ""
#   scopes: ["*"]            # default ["*"]; or e.g. [papers:read]

# ─── Search providers ──────────────────────────────────────────────────
# Providers fanned out to by POST /api/search. Default: [catalog, arxiv,
# openalex]. Add "qdrant" only when the rag URLs below are configured.
# Add "remote" to fan out to the external qatlas-search microservice
# (requires search.remote below to be enabled).
# search:
#   providers: [catalog, arxiv, openalex]
#   remote:
#     enabled: false
#     url: ""            # e.g. http://qatlas-search:8600
#     token: ""          # must equal the microservice's search.service_token
#     timeout: 60s       # agentic calls may drive an LLM — keep generous
#   agentic:
#     daily_limit: 10000   # default per-user daily limit (users with no plan row)
#     price_per_mtok: 0.0  # USD / 1M LLM tokens; admin cost display only
#     backend: remote      # remote = qatlas-search microservice (above);
#                          # local = in-process claude CLI (headless `claude -p`)
#     local:               # only used when backend: local
#       claude_bin: claude   # PATH lookup; must be OAuth-logged-in on this host
#       model: ""            # empty = claude's default model
#       sandbox_dir: ""      # empty = <paths.data_dir>/agentic; per-request
#                            # sandboxes land here and are reaped after `retention`
#       timeout: 5m          # per claude call
#       retention: 24h       # sandbox audit retention (janitor sweep)
#       max_budget_usd: 0    # 0 = no --max-budget-usd flag
#       prompt_template: ""  # empty = embedded template; placeholders:
#                            # {{.Query}} {{.MaxResults}} {{.ResultsFile}}

# ─── RAG (semantic search; needs paper_access.enabled: true) ───────────
# rag:
#   qdrant_url: qdrant.internal:6334
#   qdrant_api_key: ""
#   qdrant_collection: qatlas_papers_v1
#   embed_url: http://embed.internal:8801
#   embed_token: ""

# ─── Paper access + server-side MinerU (self-hosted opt-in) ────────────
# Default off: qatlasd does not serve PDF / markdown bytes. Flipping on
# registers /api/papers/{id}/{markdown,pdf} (+ /status) and accepts the
# redistribution obligation — see docs/about/license-and-attribution.md.
# paper_access:
#   enabled: false
#   openalex_mailto: ops@your-domain.tld   # polite-pool contact (OpenAlex + arxiv UA)
#   arxiv_fetch_concurrent: 2
#   arxiv_fetch_rps: 0.33                  # ≈ 1 req / 3 s, per arxiv guidance
#   mineru:                                # only parsed when enabled: true
#     api_tokens: []                       # pool; empty = cache-only mode
#     api_base_url: https://mineru.net
#     model_version: vlm
#     language: ch
#     is_ocr: false
#     enable_formula: true
#     enable_table: true
#     poll_interval: 3s
#     timeout: 30m
#     max_concurrent_jobs: 4

# ─── Edge label (multi-edge audit only) ────────────────────────────────
# Folded into the S3 client User-Agent. Cosmetic; never for auth.
# edge_name: us-east

# ─── Escape hatches (leave off in production) ──────────────────────────
# force_tcp4 pins a tcp4-only listener (WSL2 + Windows portproxy only).
# skip_pb_data_lock bypasses the single-process pb_data flock.
# force_tcp4: false
# skip_pb_data_lock: false

# ─── Audit user header (reverse proxy injected) ────────────────────────
# user_header: X-Token-Subject

# ─── Plugin platform (optional) ────────────────────────────────────────
# plugins:
#   dir: ~/.config/qatlasd/plugins
#   enabled: []                  # empty = all enabled
#   disabled: []                 # disabled wins over enabled
#   connect_secret: ""           # jsonrpc-ws plugin handshake secret
#   rpc_ws_bind: 127.0.0.1:8799
#   event_retention: 7d
#   rpc_timeout: 30s
#   reconnect_interval: 5s
#   deadletter_dir: ~/.local/state/qatlasd/dead
